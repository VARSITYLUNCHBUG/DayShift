---
# The server itself: the deploy user, SSH, the firewall, unattended upgrades and Docker.
dayshift_deploy_user: deploy
# Public keys for the deploy user. Required: root and password logins are switched off.
dayshift_authorized_keys: []
dayshift_timezone: Etc/UTC
# Reboot by itself at 04:00 when an unattended upgrade needs it.
dayshift_auto_reboot: true
