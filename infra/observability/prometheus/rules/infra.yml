# Alerts on what the app stands on: Postgres, pgbouncer, the edge, the host and the certificate.

groups:
  - name: draftbot-infra
    rules:
      # A dead man's switch. Prometheus, Alertmanager and the app share one host, so nothing here
      # can report that one of them (or the host) is down. This always fires; Alertmanager sends
      # it to ALERTMANAGER_WATCHDOG_URL every minute (alertmanager/alertmanager.yml), and that
      # outside service alerts when the pings stop. Never sent to Discord.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Always firing, so that its absence can be noticed"
          description: >-
            Alertmanager sends this to ALERTMANAGER_WATCHDOG_URL every minute. When the pings
            stop, that service tells you: Prometheus, Alertmanager or the host is down.

      # The app's own targets have alerts of their own (rules/app.yml). The tls job is below: its
      # target is the edge, but `up` says whether the blackbox exporter answered.
      - alert: ExporterDown
        expr: up{job!~"web|bot|scheduler|tls"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} metrics are missing"
          description: "Prometheus hasn't been able to scrape {{ $labels.instance }} for 5 minutes."
          runbook: "`docker compose ps` and the logs of the exporter for {{ $labels.job }}."

      # A dead blackbox exporter leaves probe_success with no data, so neither certificate alert
      # below could fire. Scraped every 2 minutes, so this waits for a few missed scrapes.
      - alert: BlackboxExporterDown
        expr: up{job="tls"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The blackbox exporter isn't answering"
          description: >-
            Prometheus hasn't been able to run the TLS probe of {{ $labels.instance }} for 10
            minutes, so the certificate's expiry isn't being watched.
          runbook: "`docker compose ps blackbox-exporter`, `docker compose logs blackbox-exporter`."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Postgres is down"
          description: "The exporter can't connect to the database. The app can't work without it."
          runbook: >-
            `docker compose ps db`, `docker compose logs --tail 200 db`. A full disk stops
            Postgres: check the DiskSpaceLow alert and `df -h`.

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Postgres is using {{ $value | humanizePercentage }} of its connections"
          description: "Something is connecting around pgbouncer, or its pool is sized too large."
          runbook: >-
            Postgres dashboard, connections by state. Everything but migrate should go through
            pgbouncer.

      - alert: PgbouncerDown
        expr: pgbouncer_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "pgbouncer is down"
          description: "web, bot and scheduler reach the database only through pgbouncer."
          runbook: "`docker compose ps pgbouncer`, `docker compose logs --tail 200 pgbouncer`."

      - alert: PgbouncerClientsWaiting
        expr: max(pgbouncer_pools_client_maxwait_seconds) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Clients wait {{ $value | humanizeDuration }} for a database connection"
          description: "pgbouncer's pool is exhausted: queries queue behind each other."
          runbook: >-
            Postgres dashboard: a long transaction holding connections (pg_stat_activity), or
            more concurrent transactions than default_pool_size in infra/pgbouncer/pgbouncer.ini,
            which explains the sizing.

      - alert: EdgeDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The edge (nginx) isn't answering"
          description: "Nobody can reach the web UI or the admin."
          runbook: "`docker compose ps edge`, `docker compose logs --tail 100 edge`."

      - alert: DiskSpaceLow
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs"} > 0.85)
          and on (instance, device, mountpoint) node_filesystem_readonly == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full"
          description: "Postgres stops writing when the disk fills."
          runbook: >-
            `df -h`, then `docker system df`. Old images: `docker image prune`. Old backups: the
            backup retention in the inventory. Prometheus keeps at most its size cap.

      - alert: ClockNotSynchronised
        expr: |
          min_over_time(node_timex_sync_status[5m]) == 0
            or abs(node_timex_offset_seconds) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The server's clock isn't synchronised or is over 0.5 s off"
          description: >-
            Match timers, ready-check deadlines and TLS all trust the clock; a drifting one fires
            deadlines early or late.
          runbook: >-
            `timedatectl status`, then `sudo systemctl restart systemd-timesyncd` and
            `journalctl -u systemd-timesyncd`. Outbound UDP 123 must be allowed.

      - alert: CertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The TLS certificate expires in {{ $value | humanizeDuration }}"
          description: "certbot renews 30 days ahead, so renewal has been failing for two weeks."
          runbook: >-
            `sudo journalctl -u draftbot-certbot-renew` for the renewal error, then
            `sudo /usr/local/sbin/draftbot-certbot-renew --dry-run`. Usually DNS no longer
            points here or port 80 is blocked.

      # Without this, a probe that can't reach the certificate would leave the alert above with
      # no data, and it would never fire. Without TLS (dev, the quickstart) this fires: ignore it.
      - alert: CertificateProbeFailing
        expr: probe_success{job="tls"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The edge's certificate can't be read"
          description: >-
            The TLS probe of {{ $labels.instance }} has failed for 30 minutes, so its expiry
            isn't being watched.
          runbook: >-
            `docker compose logs blackbox-exporter` for the handshake error. "unrecognized name"
            means EDGE_SERVER_NAME isn't the edge's server name.
