# Per client address. Only password attempts count against the admin login: an empty key is
# never limited, so loading the form is free.
map $request_method $login_attempt {
    POST $binary_remote_addr;
    default "";
}

# Admin password attempts: 5 a minute, with a burst of 5.
limit_req_zone $login_attempt zone=admin_login:10m rate=5r/m;
# Discord sign-in (start and callback): 30 a minute, with a burst of 20.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
# Every admin URL, the edge's own password prompts included (an admin-access basic-auth file, the
# deploy's Grafana vhost): a request a second, with a burst of 30. Plenty for a person clicking
# through the admin; each wrong password costs the edge a crypt(), and without this a script
# managed 54 guesses a second.
limit_req_zone $binary_remote_addr zone=prompt:10m rate=60r/m;
# /readyz is public but costs a database login: a request a second, with a burst of 5.
limit_req_zone $binary_remote_addr zone=readyz:1m rate=1r/s;
# Everything else: 20 requests a second, with a burst of 50 (a page and all its static files at
# once), and at most 100 requests or websockets open at a time.
limit_req_zone $binary_remote_addr zone=per_client:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=per_client_conn:10m;

limit_req_status 429;
limit_conn_status 429;
# Below the error log's level (nginx.conf): the access log has each refused request, without its
# query string.
limit_req_log_level warn;
limit_conn_log_level warn;
