---
# Every role's checks of the inventory and the vault, before a playbook changes anything, so a
# placeholder Grafana password fails in the first seconds and not after the base hardening, Docker,
# the app and a certificate request. Each role skips its own copy afterwards (draftbot_checked).
# `--tags checks` runs only these.
- name: Check the app's settings and secrets
  ansible.builtin.import_role:
    name: app
    tasks_from: checks.yml
  tags: [checks, app, app-files, app-check]

- name: Check the edge's settings
  ansible.builtin.import_role:
    name: edge
    tasks_from: checks.yml
  tags: [checks, edge, edge-check]

- name: Check the observability secrets
  ansible.builtin.import_role:
    name: observability
    tasks_from: checks.yml
  when: observability_enabled | bool
  tags: [checks, observability, observability-check]

- name: Check the backup settings
  ansible.builtin.import_role:
    name: backups
    tasks_from: checks.yml
  tags: [checks, backups, backups-check]

- name: Skip the roles' own copies of these checks
  ansible.builtin.set_fact:
    draftbot_checked: true
  tags: [always]
