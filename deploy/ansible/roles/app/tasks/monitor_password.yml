---
# The exporters log in as draftbot_monitor (compose.observability.yaml). The migrate job creates
# that role or sets its password, but only runs for a new image, so after a rotation, or on a
# server installed before the role existed, the app's own command does it here. It sends Postgres
# a SCRAM verifier, never the password (league/observability/monitoring_role.py).
#
# The check goes to `db` over the container network, where the password is checked, as it is for
# the exporters.
- name: Check the database accepts the monitoring role's password
  community.docker.docker_compose_v2_exec:
    project_src: "{{ app_root }}"
    service: db
    argv:
      - sh
      - -c
      - IFS= read -r PGPASSWORD && export PGPASSWORD && exec psql -h db -U draftbot_monitor -d draftbot -tAc 'SELECT 1'
    stdin: "{{ app_db_monitor_password }}"
  register: app_monitor_login
  changed_when: false
  failed_when: false
  # Read-only, so --check runs it too and can say whether the password would change.
  check_mode: false
  no_log: true

- name: Create the monitoring role or set its password
  community.docker.docker_compose_v2_run:
    project_src: "{{ app_root }}"
    service: migrate
    argv: [python, -m, league.observability.monitoring_role]
    no_deps: true
    cleanup: true
  when: app_monitor_login.rc != 0
  changed_when: true
  no_log: true
