---
- name: Check the deploy user can still log in once root and passwords are refused
  ansible.builtin.assert:
    that:
      - base_deploy_authorized_keys | length > 0
      - base_deploy_authorized_keys | reject('match', '^(ssh-|ecdsa-|sk-)\S+ [A-Za-z0-9+/=]{40,}') | list | length == 0
    fail_msg: >-
      base_deploy_authorized_keys needs your real public keys (the contents of ~/.ssh/id_ed25519.pub).
      This role turns off root and password logins, so without one you would be locked out.
    quiet: true
  tags: [base, base-ssh]

- name: Install packages
  ansible.builtin.import_tasks: packages.yml
  tags: [base, base-packages]

- name: Set up the deploy user
  ansible.builtin.import_tasks: users.yml
  tags: [base, base-users]

- name: Harden SSH
  ansible.builtin.import_tasks: ssh.yml
  tags: [base, base-ssh]

- name: Set up the firewall
  ansible.builtin.import_tasks: firewall.yml
  when: base_firewall_enabled
  tags: [base, base-firewall]

- name: Set up fail2ban
  ansible.builtin.import_tasks: fail2ban.yml
  when: base_fail2ban_enabled
  tags: [base, base-fail2ban]

- name: Set up unattended upgrades
  ansible.builtin.import_tasks: upgrades.yml
  tags: [base, base-upgrades]

- name: Set up failure notices
  ansible.builtin.import_tasks: notify.yml
  tags: [base, base-notify]
