# The default mode, carried over from Bebot (simpleDraft). Every mode runs the same flow: players
# vote for captains, the captains draft players, then Bebot's captain coinflip settles the sides
# and who bans and picks first ("first"). A timeout takes a random champion and captains can press
# Random.
# The hero order is Bebot's 16 steps (DCS Season 3's 2-ban order), at 40 s a turn.
schema_version: 1
slug: bebot_2ban
name: "2-ban draft (Bebot flow)"
provenance:
  source: "Bebot simpleDraft order"
  night_shift_status: not_night_shift
team_size: 6
ready_check: { seconds: 180, refill_seconds: 120 }
captains: { vote_seconds: 45, min_games: 5, max_strikes: 3 }
player_draft: { order: FSSFFSSFFS, seconds: 45, on_timeout: auto_highest_rating }
champion_draft:
  coinflip_seconds: 20
  seconds: 40
  excluded_champion_ids: []
  steps:
    - { action: ban, team: first }
    - { action: ban, team: second }
    - { action: pick, team: first }
    - { action: pick, team: second, count: 2 }
    - { action: pick, team: first, count: 2 }
    - { action: pick, team: second }
    - { action: ban, team: second }
    - { action: ban, team: first }
    - { action: pick, team: second }
    - { action: pick, team: first, count: 2 }
    - { action: pick, team: second, count: 2 }
    - { action: pick, team: first }
lobby_code: { seconds: 180 }
results: { confirm_window_seconds: 300, reminder_minutes: 45, staff_escalation_minutes: 180 }
