---
# The compose project: where it lives, which image it runs, and its .env.
dayshift_root: /opt/dayshift
dayshift_domain: ""
dayshift_image_tag: ""
# Another image than ghcr.io/varsitylunchbug/dayshift (a private fork's, say), without a tag.
dayshift_image: ""
# For a private image: the registry and a user whose token (vault_registry_password) can read it.
dayshift_registry: ghcr.io
dayshift_registry_username: ""
# `missing` pulls only images the server doesn't have yet (right for a pinned sha- tag, so site.yml
# changes nothing on a second run). deploy.yml uses `always`, which also fetches a moved tag.
dayshift_pull: missing
# After starting, check https://<domain>/readyz answers from the controller. Off for a test server
# whose name only resolves on the server itself.
dayshift_check_https: true
# A test server whose name Let's Encrypt can't reach (a .test domain, say): Caddy signs the
# certificate with its own CA instead.
dayshift_tls_internal: false

dayshift_discord_guild_id: ""
dayshift_error_log_channel_id: ""
dayshift_admin_cidrs: []
dayshift_log_level: INFO
# The player web UI's Discord OAuth app (its secret is in the vault), and the server invite
# sign-in sends people who aren't in the server to. Blank: no Discord sign-in / Discord's app.
dayshift_discord_client_id: ""
dayshift_discord_invite_url: ""

# Anything else for .env, as KEY: value.
dayshift_env_extra: {}

# Nightly pg_dump to /var/backups/dayshift, kept this many days.
dayshift_backup_keep_days: 14
dayshift_backup_on_calendar: "*-*-* 03:30:00"

# The secrets, from vault.yml.
dayshift_discord_token: "{{ vault_discord_token }}"
dayshift_django_secret_key: "{{ vault_django_secret_key }}"
dayshift_postgres_password: "{{ vault_postgres_password }}"
dayshift_alert_webhook_url: "{{ vault_alert_webhook_url | default('') }}"
dayshift_healthcheck_ping_url: "{{ vault_healthcheck_ping_url | default('') }}"
dayshift_deadlock_api_key: "{{ vault_deadlock_api_key | default('') }}"
dayshift_steam_web_api_key: "{{ vault_steam_web_api_key | default('') }}"
dayshift_discord_client_secret: "{{ vault_discord_client_secret | default('') }}"
dayshift_registry_password: "{{ vault_registry_password | default('') }}"
