name: Deploy lint

on:
  push:
    branches: [main]
    paths: &paths
      - "deploy/**"
      - "infra/**"
      - "compose.yaml"
      - "compose.observability.yaml"
      # The Molecule stand-in runs these two (molecule/default/prepare.yml copies them in).
      - "config/app_role.py"
      - "league/observability/monitoring_role.py"
      - ".github/workflows/deploy-lint.yml"
  pull_request:
    paths: *paths

concurrency:
  group: deploy-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: deploy/ansible/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint -s .
      - run: ansible-lint
      - name: Syntax-check every playbook
        run: |
          for playbook in site deploy backup restore rotate-secrets; do
            ansible-playbook -i inventories/example --syntax-check "$playbook.yml"
          done
      - name: Check the production compose files merge, as the app role combines them
        working-directory: .
        run: |
          printf '%s\n' DRAFTBOT_IMAGE_TAG=ci POSTGRES_PASSWORD=ci EDGE_SERVER_NAME=play.example.com \
            EDGE_ADMIN_ACCESS_DIR=./edge/admin-access DB_APP_PASSWORD=ci-app DB_MONITOR_PASSWORD=ci \
            GRAFANA_DOMAIN=grafana.play.example.com > .env
          docker compose -f compose.yaml -f deploy/compose.prod.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose.prod.yaml -f compose.observability.yaml \
            -f deploy/compose.grafana.yaml --profile certbot config --quiet

  molecule:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: deploy/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: deploy/ansible/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # site.yml twice on Ubuntu 24.04 and Debian 12 (the second run must change nothing), then
      # the checks in verify.yml.
      - run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
