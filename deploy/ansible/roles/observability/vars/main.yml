---
observability_compose_src: "{{ observability_repo_root }}/compose.observability.yaml"
# Every service compose.observability.yaml adds: the ones with an image of their own. The ones
# it only changes (the edge, and migrate and pgbouncer, which get the monitoring role's password)
# are compose.yaml's, run by the app and edge roles; an `up` here would rerun the migrate job.
observability_services: >-
  {{ (lookup('ansible.builtin.file', observability_compose_src) | from_yaml).services
     | dict2items | selectattr('value.image', 'defined') | map(attribute='key') | list }}
# The services that mount infra/observability, restarted when it changes.
observability_config_services: [prometheus, alertmanager, grafana, blackbox-exporter]
# Grafana's and Alertmanager's env_file (compose.observability.yaml's default name).
observability_env_file: "{{ observability_root }}/.env.observability"
# Values that mean the vault was never filled in.
observability_placeholders: ["", "REPLACE_ME", "change-me", "changeme"]
