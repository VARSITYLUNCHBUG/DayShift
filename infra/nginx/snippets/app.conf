# The app's routes, shared by the http and https sites. Include inside a server block.

# Report screenshots are up to 20 MB, plus the form around them. Bodies over 128k are buffered on
# the /tmp tmpfs before web gets them; compose.yaml sizes that tmpfs and the memory limit for a
# handful of full-size uploads at once.
client_max_body_size 21m;
client_body_buffer_size 128k;

include /etc/nginx/snippets/security-headers.conf;
include /etc/nginx/snippets/proxy.conf;

# Every request, per client address (snippets/rate-limits.conf). A location with a limit_req of its
# own replaces this one, so those below repeat it.
limit_req zone=per_client burst=50 nodelay;
limit_conn per_client_conn 100;

# Internal only. Prometheus scrapes web:8000/metrics and edge:8081/nginx_status directly.
location = /metrics {
    return 404;
}

location = /nginx_status {
    return 404;
}

# Static files, straight from disk: the image's collectstatic output, which migrate copies to the
# shared volume mounted here. Django never serves them. Pages link the hashed names
# (ManifestStaticFilesStorage), which never change, so browsers keep those for a year; with DEBUG
# on, pages link the plain names, which get an hour. gzip_static serves the .gz copies
# collectstatic wrote, so nothing is compressed per request.
location /static/ {
    alias /srv/static/;
    gzip_static on;
    expires 1h;
    # The header below keeps the security headers above as well.
    add_header_inherit merge;

    location ~ "\.[0-9a-f]{12}\.[A-Za-z0-9]+$" {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The player web UI's bundle (frontend/, built by Vite), whose names carry Vite's own hash
    # rather than Django's. Its index.html is served by web, never from here.
    location ^~ /static/frontend/assets/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The manifest is for Django, not browsers.
    location = /static/staticfiles.json {
        return 404;
    }
}

# The players' websocket, /ws/ (config/asgi.py): held open for as long as the page is.
location /ws/ {
    limit_req zone=per_client burst=50 nodelay;
    proxy_pass http://web;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# The admin. /etc/nginx/admin-access/*.conf is an optional access-control hook, empty by default:
# whatever those files hold (allow/deny lines, auth_basic) applies to every admin URL, the login
# form included. compose.yaml mounts EDGE_ADMIN_ACCESS_DIR there (infra/nginx/admin-access, see
# its README). The prompt limit runs before auth_basic does, so a password file there can't be
# guessed at speed either.
location = /admin/login/ {
    include /etc/nginx/admin-access/*.conf;
    limit_req zone=admin_login burst=5 nodelay;
    limit_req zone=prompt burst=30 nodelay;
    limit_req zone=per_client burst=50 nodelay;
    proxy_pass http://web;
}

location /admin/ {
    include /etc/nginx/admin-access/*.conf;
    limit_req zone=prompt burst=30 nodelay;
    limit_req zone=per_client burst=50 nodelay;
    proxy_pass http://web;
}

location /auth/ {
    limit_req zone=auth burst=20 nodelay;
    limit_req zone=per_client burst=50 nodelay;
    proxy_pass http://web;
}

# Readiness is public, for uptime checks, but each request opens a database connection.
location = /readyz {
    limit_req zone=readyz burst=5 nodelay;
    proxy_pass http://web;
}

location / {
    proxy_pass http://web;
}
