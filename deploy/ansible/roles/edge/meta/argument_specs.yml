---
argument_specs:
  main:
    short_description: The nginx edge's TLS. Configuration, certificate, renewals, Grafana's vhost.
    options:
      edge_root:
        type: path
        required: true
        description: The compose project directory. Defaults to draftbot_root.
      edge_domain:
        type: str
        required: true
        description: The public hostname the certificate is for. Defaults to draftbot_domain.
      edge_nginx_src:
        type: path
        description: infra/nginx on the controller.
      edge_certificate:
        type: str
        default: letsencrypt
        choices: [letsencrypt, selfsigned]
        description: Let's Encrypt over HTTP-01, or a self-signed one for a server without public DNS.
      edge_acme_email:
        type: str
        default: ""
        description: Let's Encrypt account email. Required for letsencrypt.
      edge_acme_server:
        type: str
        default: https://acme-v02.api.letsencrypt.org/directory
        description: The ACME directory URL, such as Let's Encrypt staging.
      edge_renew_on_calendar:
        type: str
        default: "*-*-* 00,12:00:00"
        description: When the renewal check runs, in systemd calendar syntax.
      edge_renew_randomized_delay:
        type: str
        default: 1h
        description: Random delay added to that time.
      edge_grafana_domain:
        type: str
        default: ""
        description: Serve Grafana at this name too. Defaults to draftbot_grafana_domain.
      edge_grafana_basic_auth_users:
        type: list
        elements: dict
        default: []
        no_log: true
        description: >-
          Grafana's password prompt: {username, password} entries, hashed on the server like
          edge_admin_basic_auth_users. Required with edge_grafana_domain.
      edge_grafana_allow_cidrs:
        type: list
        elements: str
        default: []
        description: Addresses or CIDRs allowed to reach Grafana. Empty allows everyone.
      edge_admin_allow_cidrs:
        type: list
        elements: str
        default: []
        description: Addresses or CIDRs allowed to reach the Django admin. Empty allows everyone.
      edge_admin_basic_auth_users:
        type: list
        elements: dict
        default: []
        no_log: true
        description: >-
          A password prompt in front of the Django admin: {username, password} entries, hashed on
          the server. Empty asks for none.
      edge_admin_satisfy:
        type: str
        default: all
        choices: [all, any]
        description: With both an allowlist and users, ask for both (all) or either (any).
      edge_wait_timeout:
        type: int
        default: 120
        description: Seconds the edge has to become healthy.
      edge_check_public_url:
        type: bool
        default: true
        description: Fetch https://<domain>/readyz through the edge at the end.
      edge_public_url_validate_certs:
        type: bool
        default: true
        description: Check the certificate on that fetch.
