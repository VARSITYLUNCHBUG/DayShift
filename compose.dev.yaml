# Local dev stack: the app against the Discord simulator, seeded from fixtures/dev, with the dev
# control panel. `make dev` starts it; see the Makefile and docs/dev/README.md.
#
#   docker compose -p draftbot-dev -f compose.yaml -f compose.dev.yaml --profile sim up -d
#
# Ports are on 127.0.0.1 only (DEV_BIND; the Windows dev VM sets 0.0.0.0, so the host's browser
# reaches them), each set by an env var so two stacks can run side by side under another -p. Real-Discord mode: `make dev REAL_DISCORD=1` uses .env (a real token and guild id)
# and leaves out the simulator.

name: draftbot-dev

x-dev-app: &dev-app
  # The image's dev target: the published one plus devtools/ and fixtures/ (Dockerfile).
  build:
    target: dev
  # A local tag named after the project, so a dev build never overwrites the published image.
  image: ${COMPOSE_PROJECT_NAME}/app:local
  env_file: !override
    # .env.dev (from .env.dev.example) points the app at the simulator.
    - path: ${DRAFTBOT_ENV_FILE:-.env.dev}
      required: false

x-dev-env: &dev-env
  DATABASE_URL: postgres://draftbot:dev@db:5432/draftbot
  BOT_HEARTBEAT_FILE: /tmp/bot-heartbeat
  DEBUG: "true"
  DEV_CONTROL: "true"
  ALLOWED_HOSTS: localhost,127.0.0.1,web
  LOG_FORMAT: ${LOG_FORMAT:-text}

# The dev-only services get the same hardening as the app.
x-dev-hardening: &dev-hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  tmpfs:
    - /tmp
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  edge:
    ports: !override
      - "${DEV_BIND:-127.0.0.1}:${DEV_EDGE_PORT:-18080}:8080"

  db:
    environment:
      POSTGRES_PASSWORD: dev
    ports: !override
      - "${DEV_BIND:-127.0.0.1}:${DEV_DB_PORT:-15432}:5432"

  migrate:
    <<: *dev-app
    environment:
      <<: *dev-env
      SERVICE_NAME: migrate
    depends_on:
      db:
        condition: service_healthy
      discord-sim:
        condition: service_healthy
        # Real-Discord mode runs without the simulator.
        required: false

  web:
    <<: *dev-app
    environment:
      <<: *dev-env
      SERVICE_NAME: web
      DB_CONN_MAX_AGE: "0"
      FORWARDED_ALLOW_IPS: "*"
    # Straight to web as well as through the edge: the control panel and the e2e suite use it.
    ports:
      - "${DEV_BIND:-127.0.0.1}:${DEV_WEB_PORT:-18000}:8000"
    healthcheck:
      interval: 10s

  bot:
    <<: *dev-app
    environment:
      <<: *dev-env
      SERVICE_NAME: bot
    healthcheck:
      interval: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      discord-sim:
        condition: service_healthy
        required: false

  # compose.test.yaml extends these two, so a setting added here reaches the test stack too.
  discord-sim:
    <<: *dev-hardening
    profiles: [sim]
    build: services/discord-sim
    image: ${COMPOSE_PROJECT_NAME}/discord-sim:local
    environment:
      SIM_SEED_USERS: ${SIM_SEED_USERS:-0}
    ports:
      - "${DEV_BIND:-127.0.0.1}:${DEV_SIM_PORT:-18090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/_sim/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s

  control-panel:
    <<: *dev-hardening
    profiles: [sim]
    build: services/control-panel
    image: ${COMPOSE_PROJECT_NAME}/control-panel:local
    ports:
      - "${DEV_BIND:-127.0.0.1}:${DEV_PANEL_PORT:-18091}:8091"
    depends_on:
      web:
        condition: service_healthy
      discord-sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
