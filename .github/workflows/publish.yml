# Pushes the app image to GHCR. ci.yml calls it once every check has passed, the browser suite
# included, on a push to main or a version tag.
#
# Nothing is built here: ci.yml's app-image job built the release image once (with its SBOM and
# provenance), Trivy scanned that build, and this pushes the same layout under each tag, digest
# unchanged, so what runs on a server is exactly what was scanned and tested. The tags:
#
#   latest, main   follow main
#   sha-<commit>   one build, by short commit (what a deploy pins)
#   1.2.3, 1.2     from a v1.2.3 tag
name: Publish

on:
  workflow_call:
    inputs:
      tags:
        description: The image's tags, one per line (docker/metadata-action's output).
        required: true
        type: string
      digest:
        description: The digest of the image ci.yml built and scanned.
        required: true
        type: string

permissions: {}

jobs:
  app:
    name: App image to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # One push to a ref's tags at a time; ci.yml's concurrency keeps the runs in commit order.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Copies an OCI image layout to a registry as it is (--preserve-digests refuses any change).
      SKOPEO_IMAGE: quay.io/skopeo/stable:v1.24.1@sha256:4b440098ada2bc2623308b0f60f5a5454084b98683e9e7dcecd77bba69797c56
      TAGS: ${{ inputs.tags }}
      DIGEST: ${{ inputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-image
          path: ${{ runner.temp }}/app-image
      # The index, its image and its attestations, under every tag. The layout has an entry per
      # tag (named by the part after the colon), all of the same digest, and each tag must then
      # name the digest ci.yml scanned.
      #
      # skopeo logs in itself, into an auth file of its own: the job token goes in on stdin (never
      # on a command line), and the login is checked before anything is pushed. Reading
      # docker/login-action's ~/.docker/config.json instead left GHCR seeing an anonymous,
      # pull-only client ("denied: permission_denied: write_package").
      - name: Push the scanned image under each tag
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          auth="$RUNNER_TEMP/skopeo-auth"
          mkdir -p "$auth"
          chmod 700 "$auth"
          skopeo() {
            docker run --rm -i -v "$RUNNER_TEMP/app-image:/image:ro" -v "$auth:/auth" \
              -e REGISTRY_AUTH_FILE=/auth/auth.json "$SKOPEO_IMAGE" "$@"
          }
          registry="${TAGS%%/*}"
          printf '%s' "$REGISTRY_TOKEN" \
            | skopeo login --username "$GITHUB_ACTOR" --password-stdin "$registry"
          echo "Logged in to $registry as $(skopeo login --get-login "$registry")"
          for tag in $TAGS; do
            skopeo copy --all --preserve-digests "oci:/image:${tag##*:}" "docker://$tag" </dev/null
            pushed="sha256:$(skopeo inspect --raw "docker://$tag" </dev/null | sha256sum | cut -d' ' -f1)"
            if [ "$pushed" != "$DIGEST" ]; then
              echo "::error::$tag is $pushed, not the scanned $DIGEST"
              exit 1
            fi
            echo "$tag -> $pushed"
          done
      - name: Remove the registry login
        if: always()
        run: rm -rf "$RUNNER_TEMP/skopeo-auth"
