# The merge gate, kept small: the same checks a dev machine runs before each commit (make check),
# the unit suite (make test's suite, on the runner), and on a push to main or a version tag the app
# image, built once, scanned and published. Everything else runs on a dev machine: the browser
# suite with `make e2e` (or e2e.yml by hand), the simulator's and the panel's own suites with
# their own tools. `CI OK` is the one check branch protection requires.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on main and tags queue and finish in
# order, so an older build never moves `latest` after a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"
  PYTHON_VERSION: "3.13"
  IMAGE: ghcr.io/varsitylunchbug/dayshift

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv sync --frozen
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  # Named for Scorecard's CI-Tests check, which looks for "test" in a check's name.
  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_USER: dayshift
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dayshift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dayshift" --health-interval 2s --health-retries 30
          --tmpfs /var/lib/postgresql/data
    env:
      DATABASE_URL: postgres://dayshift:test@127.0.0.1:5432/dayshift
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DOTENV: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: uv.lock
      # The OCR group is optional and large; its tests skip without it.
      - run: uv sync --frozen
      - run: uv run --frozen pytest -n auto -p no:cacheprovider --durations=15
        env:
          HYPOTHESIS_PROFILE: ci

  # The one required status check.
  ok:
    name: CI OK
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")'

  # On a push to main or a version tag, once the checks pass: build the image once, scan it, and
  # push that same build. Tags: latest and main follow main; sha-<commit> pins one build of main
  # (what a deploy uses); 1.2.3 and 1.2 come from a v1.2.3 tag.
  image:
    name: Image
    if: github.event_name == 'push'
    needs: [ok]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Loaded into the runner's Docker for the scan; the push below reuses every cached layer.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app,ignore-error=true
      # Fails on a HIGH or CRITICAL vulnerability that has a fixed version to move to.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=app
      # Signed build provenance for the pushed digest, kept with the image in the registry.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # A version tag also gets a GitHub release carrying that signed provenance, so the release
      # itself is verifiable (gh attestation verify, or Scorecard's Signed-Releases check).
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cp "$BUNDLE" "$RUNNER_TEMP/dayshift.sigstore.json"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes "Image: $IMAGE@$DIGEST" "$RUNNER_TEMP/dayshift.sigstore.json"
