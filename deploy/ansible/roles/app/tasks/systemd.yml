---
# The playbooks run this last, once the edge and observability roles have put their files in
# place, since the unit starts every service in the project.
- name: Install the boot unit
  ansible.builtin.template:
    src: draftbot.service.j2
    dest: "/etc/systemd/system/{{ app_systemd_unit }}.service"
    owner: root
    group: root
    mode: "0644"
  register: app_unit

# Everything is already up, so starting the unit changes nothing but its state; stopping it
# stops the project.
- name: Enable and start the boot unit
  ansible.builtin.systemd_service:
    name: "{{ app_systemd_unit }}.service"
    enabled: true
    state: started
    daemon_reload: "{{ app_unit is changed }}"
