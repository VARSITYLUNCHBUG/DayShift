---
# sshd -t needs its privilege separation directory, which only exists once sshd has started.
- name: Make sure sshd's runtime directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

# sshd reads its drop-ins in name order and keeps the first value it sees, so 10- wins over the
# 50-cloud-init.conf some images ship with PasswordAuthentication yes.
- name: Install the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd_config.conf.j2
    dest: /etc/ssh/sshd_config.d/10-draftbot.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Keep SSH on at boot
  ansible.builtin.service:
    name: ssh
    enabled: true
