---
# Through the Docker API, so the token is never on a command line.
- name: Log in to the registry
  community.docker.docker_login:
    registry_url: "{{ app_registry }}"
    username: "{{ app_registry_username }}"
    password: "{{ app_registry_password }}"
  when: app_registry_username | length > 0
  no_log: true

- name: Pull the images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ app_root }}"
    policy: "{{ app_pull_policy }}"

- name: Start the database
  community.docker.docker_compose_v2:
    project_src: "{{ app_root }}"
    services: [db]
    dependencies: false
    wait: true
    wait_timeout: "{{ app_wait_timeout }}"

- name: Keep the database password in step with the vault
  ansible.builtin.include_tasks: db_password.yml

# The image comes from the compose files (compose.prod.yaml, or DRAFTBOT_IMAGE in .env).
- name: Read the migrate job's image
  ansible.builtin.command:
    cmd: docker compose config --format json migrate
    chdir: "{{ app_root }}"
  register: app_migrate_config
  changed_when: false
  check_mode: false
  no_log: true

- name: Look up the app image
  community.docker.docker_image_info:
    name: "{{ (app_migrate_config.stdout | from_json).services.migrate.image }}"
  register: app_image_info

- name: Read which image last migrated the database
  ansible.builtin.slurp:
    src: "{{ app_migrated_marker }}"
  register: app_migrated
  failed_when: false

- name: Run the migrate job
  when: >-
    app_force_migrate
    or app_migrated.content is not defined
    or (app_migrated.content | b64decode | trim) != app_image_info.images[0].Id
  block:
    - name: Migrate and load the presets
      community.docker.docker_compose_v2_run:
        project_src: "{{ app_root }}"
        service: migrate
        no_deps: true
        cleanup: true
        quiet_pull: true

    - name: Remember that this image migrated the database
      ansible.builtin.copy:
        dest: "{{ app_migrated_marker }}"
        content: "{{ app_image_info.images[0].Id }}\n"
        owner: root
        group: root
        mode: "0644"

- name: Keep the app role's password in step with the vault
  ansible.builtin.include_tasks: app_password.yml

- name: Keep the monitoring role's password in step with the vault
  ansible.builtin.include_tasks: monitor_password.yml
  when: app_observability | bool
