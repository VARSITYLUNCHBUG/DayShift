# One JSON object per request on stdout, like the app's own logs. The path is $uri, without the
# query string: OAuth callbacks carry their code there (nginx.conf keeps it out of the error log
# too, as far as nginx allows). $request_id is also sent to web as
# X-Request-ID, so a line here can be matched to the app's.
log_format json escape=json '{'
    '"ts":"$time_iso8601",'
    '"service":"edge",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"protocol":"$server_protocol",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
'}';

# The image links this file to the container's stdout.
access_log /var/log/nginx/access.log json;
