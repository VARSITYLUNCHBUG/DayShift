---
argument_specs:
  main:
    short_description: Install the nightly database backup.
    options: &common
      backups_compose_dir:
        type: path
        required: true
        description: The compose project directory. Defaults to draftbot_root.
      backups_dir:
        type: path
        default: /var/backups/draftbot
        description: Where dumps are written on the server.
      backups_retention_days:
        type: int
        default: 14
        description: Days a dump is kept, here and offsite.
      backups_on_calendar:
        type: str
        default: "*-*-* 03:30:00"
        description: When the nightly backup runs, in systemd calendar syntax.
      backups_randomized_delay:
        type: str
        default: 15m
        description: Random delay added to that time.
      backups_rclone_remote:
        type: str
        default: ""
        description: rclone remote and path for offsite copies. Empty keeps dumps on the server.
      backups_rclone_config:
        type: str
        default: ""
        no_log: true
        description: rclone.conf contents defining that remote.
      backups_offsite_age_recipients:
        type: list
        elements: str
        default: []
        description: age public keys each offsite copy is encrypted to. Required with backups_rclone_remote.
      backups_rclone_prune:
        type: bool
        default: true
        description: Delete offsite dumps past the retention too.
  run:
    short_description: Take a backup now.
    options:
      <<: *common
      backups_fetch_dir:
        type: str
        default: ""
        description: Also copy the new dump to this directory on the controller.
  restore:
    short_description: Check a dump by restoring it to a scratch database, or replace the live one.
    options:
      <<: *common
      backups_restore_mode:
        type: str
        default: verify
        choices: [verify, replace]
        description: verify restores into a scratch database; replace swaps the live database.
      backups_restore_file:
        type: str
        default: ""
        description: A dump on the server. Empty takes the newest.
      backups_restore_upload:
        type: str
        default: ""
        description: A dump on the controller to upload and restore instead.
      backups_restore_confirm:
        type: bool
        default: false
        description: Must be true for replace.
      backups_restore_check_sql:
        type: str
        default: SELECT (SELECT count(*) FROM players) + (SELECT count(*) FROM matches)
        description: >-
          A count of the league's data, run on the restored copy and the live database. A copy
          with none fails while the live database has some.
