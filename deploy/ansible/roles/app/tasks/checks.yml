---
# One check per secret, so a failure names the one to fix. Each item holds a true/false and a
# message, never the secret itself, so the message needn't be hidden from the log (no_log would
# hide it too).
- name: Refuse placeholder or malformed secrets
  ansible.builtin.assert:
    that: item.ok | bool
    fail_msg: "{{ item.msg }} See vault.yml.example."
    quiet: true
  loop:
    - name: "vault_discord_token"
      ok: "{{ app_discord_token not in app_placeholders }}"
      msg: vault_discord_token is missing or still a placeholder.
    - name: "vault_django_secret_key"
      ok: "{{ app_django_secret_key not in app_placeholders and app_django_secret_key | length >= 40 }}"
      msg: vault_django_secret_key must be 40+ characters, not a placeholder.
    - name: "vault_postgres_password"
      ok: "{{ app_postgres_password not in app_placeholders and app_postgres_password is match(app_url_safe) }}"
      msg: vault_postgres_password must be 16+ letters, digits, - or _, not a placeholder.
    - name: "vault_db_app_password"
      ok: "{{ app_db_app_password not in app_placeholders and app_db_app_password is match(app_url_safe) }}"
      msg: vault_db_app_password must be 16+ letters, digits, - or _, not a placeholder.
    - name: "vault_db_app_password differs"
      ok: "{{ app_db_app_password != app_postgres_password }}"
      msg: vault_db_app_password must differ from vault_postgres_password.
    # It goes into the exporters' connection strings as it is.
    - name: "vault_db_monitor_password"
      ok: "{{ not app_observability | bool or app_db_monitor_password is match('^[A-Za-z0-9]{16,}$') }}"
      msg: vault_db_monitor_password (needed with observability) must be 16+ letters or digits.
    - name: "vault_db_monitor_password differs"
      ok: >-
        {{ not app_observability | bool
           or app_db_monitor_password not in [app_postgres_password, app_db_app_password] }}
      msg: vault_db_monitor_password must differ from the other database passwords.
    - name: "secrets' characters"
      ok: "{{ app_secret_values | select('search', app_unquotable) | list | length == 0 }}"
      msg: >-
        A secret (the Discord token or client secret, DJANGO_SECRET_KEY, an API key, the registry
        password) holds a quote or a line break.
  loop_control:
    label: "{{ item.name }}"
  vars:
    app_url_safe: '^[A-Za-z0-9_-]{16,}$'
    app_unquotable: "['\n\r]"
    app_secret_values:
      - "{{ app_discord_token }}"
      - "{{ app_discord_client_secret }}"
      - "{{ app_django_secret_key }}"
      - "{{ app_deadlock_api_key }}"
      - "{{ app_steam_web_api_key }}"
      - "{{ app_registry_password }}"

- name: Check the settings
  ansible.builtin.assert:
    that:
      - app_discord_guild_id | string is match('^[0-9]{15,22}$')
      - app_error_log_channel_id | string is match('^([0-9]{15,22})?$')
      - app_domain is match('^[A-Za-z0-9.-]+$')
      - app_grafana_domain is match('^[A-Za-z0-9.-]*$')
      - app_image is match('^[a-z0-9./_:-]*$')
      - app_image_tag is match('^[A-Za-z0-9_.-]+$')
      - app_grafana_domain | length == 0 or app_observability | bool
    fail_msg: >-
      app_discord_guild_id (and app_error_log_channel_id, if set) must be Discord IDs,
      draftbot_domain and draftbot_grafana_domain bare hostnames, app_image an image name without
      a tag, and draftbot_image_tag a tag. draftbot_grafana_domain needs draftbot_observability.
    quiet: true

# A second DEBUG or DEV_CONTROL line in .env would turn the dev-only features on in production.
- name: Check app_env_extra only adds settings
  ansible.builtin.assert:
    that:
      - app_env_extra.keys() | reject('match', '^[A-Z][A-Z0-9_]*$') | list | length == 0
      - app_env_extra.keys() | intersect(app_env_reserved) | list | length == 0
      # COMPOSE_PROJECT_NAME or COMPOSE_PROFILES would change which containers compose manages.
      - app_env_extra.keys() | select('match', '^COMPOSE_') | list | length == 0
      - app_env_extra.values() | map('string') | select('search', "['\n\r]") | list | length == 0
    fail_msg: >-
      app_env_extra keys must be UPPER_CASE names that .env doesn't already set, that aren't
      dev-only ({{ app_env_extra.keys() | intersect(app_env_reserved) | join(', ') }}) and don't
      start with COMPOSE_, and no value may hold a quote or a line break.
    quiet: true
