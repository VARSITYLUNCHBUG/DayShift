# How every request is passed to web. The edge is the outermost proxy, so it replaces
# X-Forwarded-For with the address it saw rather than trusting what the client sent. uvicorn
# believes these headers only from the edge network (FORWARDED_ALLOW_IPS).
proxy_http_version 1.1;
proxy_redirect off;

# $http_host keeps the port the browser used, which Django's CSRF origin check compares against.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
