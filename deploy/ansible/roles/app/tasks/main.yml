---
- name: Check the inventory and the vault
  ansible.builtin.assert:
    that:
      - dayshift_domain | length > 0
      - dayshift_image_tag | length > 0
      - dayshift_discord_guild_id is match('^[0-9]{17,20}$')
      - dayshift_discord_token | length > 0
      - dayshift_django_secret_key | length >= 50
      - dayshift_postgres_password is match('^[A-Za-z0-9]{16,}$')
    fail_msg: >-
      Set dayshift_domain, dayshift_image_tag and dayshift_discord_guild_id in group_vars/all/main.yml,
      and vault_discord_token, vault_django_secret_key (50+ characters) and vault_postgres_password
      (16+ letters and digits) in the vault.
    quiet: true

# --- The compose project: two compose files and the Caddyfile from this checkout, and .env ----------
- name: Create the project directory
  ansible.builtin.file:
    path: "{{ dayshift_root }}/infra/caddy"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install the compose files and the Caddyfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ item.src }}"
    dest: "{{ dayshift_root }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: compose.yaml, dest: compose.yaml }
    - { src: deploy/compose.prod.yaml, dest: compose.prod.yaml }
    - { src: infra/caddy/Caddyfile, dest: infra/caddy/Caddyfile }
  loop_control:
    label: "{{ item.dest }}"

# Compose recreates every container whose settings change here on the next `up`.
- name: Write .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ dayshift_root }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

# --- The image ----------------------------------------------------------------------------------
- name: Log in to the registry, for a private image
  community.docker.docker_login:
    registry_url: "{{ dayshift_registry }}"
    username: "{{ dayshift_registry_username }}"
    password: "{{ dayshift_registry_password }}"
  when: dayshift_registry_username | length > 0
  no_log: true

# migrate runs first (web and bot wait for it), then everything waits to be healthy.
- name: Pull the images and start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ dayshift_root }}"
    pull: "{{ dayshift_pull }}"
    remove_orphans: true
    wait: true
    wait_timeout: 300
  register: app_up
  # migrate runs again on every `up`, by design; only the other services count as a change.
  changed_when: app_up.actions | default([]) | rejectattr('id', 'search', 'migrate') | list | length > 0

- name: Check the site answers over HTTPS
  ansible.builtin.uri:
    url: "https://{{ dayshift_domain }}/readyz"
    status_code: 200
  register: app_ready
  retries: 10
  delay: 6
  until: app_ready.status == 200
  delegate_to: localhost
  become: false
  when: dayshift_check_https | bool

# --- Backups and the host's health checks, which post to the alert webhook --------------------------
- name: Install the backup, health and notify scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0700"
  loop: [dayshift-backup, dayshift-health, dayshift-notify]

- name: Install the systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - dayshift-backup.service
    - dayshift-backup.timer
    - dayshift-health.service
    - dayshift-health.timer
    - dayshift-notify@.service
  notify: Reload systemd

- name: Load changed units before starting their timers
  ansible.builtin.meta: flush_handlers

- name: Start the backup and health timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [dayshift-backup.timer, dayshift-health.timer]
