---
# Postgres only reads POSTGRES_PASSWORD when it creates the database, so a rotated password is set
# here. The password only ever travels on stdin, never on a command line where `ps` would show it.
#
# The image trusts the socket and loopback, so the check connects to the container's network
# address, `db`, where the password is checked as it is for pgbouncer and migrate.
- name: Check the database accepts the vault's password
  community.docker.docker_compose_v2_exec:
    project_src: "{{ app_root }}"
    service: db
    argv:
      - sh
      - -c
      - IFS= read -r PGPASSWORD && export PGPASSWORD && exec psql -h db -U draftbot -d draftbot -tAc 'SELECT 1'
    stdin: "{{ app_postgres_password }}"
  register: app_db_login
  changed_when: false
  failed_when: false
  # Read-only, so --check runs it too and can say whether the password would change.
  check_mode: false
  no_log: true

# Over the socket, as the superuser, with statement logging off for this session so the new
# password can't land in the server log.
- name: Set the database password to the vault's
  community.docker.docker_compose_v2_exec:
    project_src: "{{ app_root }}"
    service: db
    argv: [psql, -U, draftbot, -d, draftbot, -v, ON_ERROR_STOP=1, -q]
    stdin: |
      SET log_statement = 'none';
      SET log_min_duration_statement = -1;
      \set pw '{{ app_postgres_password }}'
      ALTER ROLE draftbot WITH PASSWORD :'pw';
  when: app_db_login.rc != 0
  changed_when: true
  no_log: true
