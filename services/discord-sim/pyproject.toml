[project]
name = "discord-sim"
version = "1.0.0"
description = "A small fake Discord (REST v10, gateway, control API) for running DayShift locally and in tests."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.14,<4",
]

[project.scripts]
discord-sim = "discord_sim.__main__:main"

[dependency-groups]
dev = [
    # The tests drive the real client library against the sim. Pin it to the version the bot uses.
    "discord.py==2.7.1",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["discord", "discord.*"]
ignore_missing_imports = true
