; pgbouncer between the long-running services (web, bot, scheduler) and Postgres. migrate and
; anything that needs a session of its own (LISTEN) connect to db directly instead.
;
; Transaction pooling: a server connection is lent to a client for one transaction, then goes
; back to the pool. The app is safe under it (config/settings.py, DB_PGBOUNCER): no server-side
; cursors, no prepared statements (Django binds parameters client-side), no session-level SET,
; advisory locks, temp tables or LISTEN; row locks and SET CONSTRAINTS end with the transaction.
; Postgres and pgbouncer both run in UTC, so Django never sends SET TIME ZONE.
;
; Sizing. Client connections and server connections are counted separately:
;
; - Clients. The bot and the scheduler run all their database work on one thread each
;   (league.asyncdb) and keep that connection: 2 clients. The web process is different: under
;   ASGI every request runs its synchronous part on a thread of its own, so it opens one client
;   connection per request in flight, and closes it when the request ends (compose.yaml gives
;   web DB_CONN_MAX_AGE=0; kept connections were stranded with their threads, measured at 34
;   clients left open after a burst of 40 concurrent requests). Add the healthchecks, `manage.py` shells
;   and the exporter: max_client_conn 200 is room for ~190 web requests in flight at once.
; - Servers. A server connection is only held for one transaction, and the app's transactions
;   are short: under the same bursts (80 concurrent requests, a full simulated match) pgbouncer
;   used 2 or 3 server connections. A pool of 20 (+5 reserve) never makes one wait at this scale,
;   and max_db_connections 30 leaves Postgres's 100 room for migrate, backups (pg_dump), the
;   exporters and psql.

[databases]
draftbot = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; TCP only: the read-only container has no socket directory.
unix_socket_dir =

; Clients log in with SCRAM. The entrypoint writes the auth file to tmpfs from the environment
; at start, so the password is never on disk or in the repo; pgbouncer logs in to Postgres
; with the same credentials, also over SCRAM.
auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt
; Read-only SHOW commands on the `pgbouncer` console, for the pgbouncer exporter. The entrypoint
; adds this user to the auth file only when DB_MONITOR_PASSWORD is set (the observability overlay).
stats_users = draftbot_monitor

pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 30

; Give up on a client that waits this long for a server connection, rather than hang it.
query_wait_timeout = 30
; After a failed login to Postgres (it restarted, say), retry in 3 s instead of the default 15 s,
; so clients get the cached error for a shorter time once the database is back.
server_login_retry = 3
; Recycle server connections hourly, and close ones idle for 10 minutes.
server_lifetime = 3600
server_idle_timeout = 600

; Connection churn would drown the useful lines (Django reconnects every CONN_MAX_AGE).
log_connections = 0
log_disconnections = 0
stats_period = 60
