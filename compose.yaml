# The whole stack. On its own it is the self-host quickstart:
#
#   docker compose up -d --build        then open http://127.0.0.1:8000/admin/
#
# Overrides layer on top: compose.dev.yaml (local dev against the Discord simulator),
# compose.test.yaml (throwaway test stacks) and deploy/compose.prod.yaml (HTTPS on 80/443 for a
# real domain). The Makefile drives all of them.
#
#   edge     Caddy, the only way in (infra/caddy/Caddyfile). Plain HTTP on 127.0.0.1 here
#   web      the Django admin and the calibration dashboard (uvicorn), and the static files
#   bot      the Discord gateway connection, clicks, the effect worker, the deadline loop and
#            the health watchdog
#   migrate  one-shot: migrations and presets, then exits; web and bot wait for it
#   db       Postgres, in UTC
#
# Every service runs on a read-only root filesystem with no Linux capabilities, and the app's as
# a non-root user. `.env` (from .env.example) is the app's environment file.

name: dl-mm-discord

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

x-app: &app
  <<: *hardening
  build:
    context: .
    args:
      # true to read report screenshots with score OCR. Then turn it on in the admin: the
      # server's Score OCR setting.
      INSTALL_OCR: ${INSTALL_OCR:-false}
  # Published to the repo's packages. `docker compose pull` fetches it; `--build` builds it here.
  image: ${DRAFTBOT_IMAGE:-ghcr.io/varsitylunchbug/dl-mm-discord}:${DRAFTBOT_IMAGE_TAG:-latest}
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgres://draftbot:${POSTGRES_PASSWORD:-change-me}@db:5432/draftbot
    BOT_HEARTBEAT_FILE: /tmp/bot-heartbeat
  # Sized, so a burst of uploads (Django spools bodies over 2.5 MB here) fails a request rather
  # than filling the container's memory limit, which tmpfs pages count against.
  tmpfs:
    - /tmp:size=128m
  networks: [backend]
  stop_grace_period: 30s

services:
  edge:
    <<: *hardening
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment:
      EDGE_SITE: ${EDGE_SITE:-:8080}
      EDGE_ADMIN_CIDRS: ${EDGE_ADMIN_CIDRS:-0.0.0.0/0 ::/0}
      EDGE_TLS: ${EDGE_TLS:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account, kept across restarts.
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${EDGE_PORT:-8000}:8080"
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    cpus: "1"
    mem_limit: 256m
    pids_limit: 128

  db:
    <<: *hardening
    image: postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    # The image's postgres user; the data volume is already its own.
    user: "70:70"
    environment:
      POSTGRES_USER: draftbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: draftbot
      # Page checksums, so disk corruption is reported rather than read back. Only applies when
      # the data volume is created.
      POSTGRES_INITDB_ARGS: --data-checksums
    # UTC, so Django never has to SET TIME ZONE. Sized for a 1 GB limit.
    command: >-
      postgres
      -c timezone=UTC -c log_timezone=UTC
      -c max_connections=50
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      -c work_mem=8MB -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c idle_in_transaction_session_timeout=5min
      -c log_min_duration_statement=500ms -c log_lock_waits=on
    # Loopback only, for tools on the host (uv run, psql). The production override removes it.
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70
    networks: [backend]
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      # Over TCP: the first-boot server only listens on its socket.
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "draftbot", "-d", "draftbot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    mem_limit: 1g
    pids_limit: 256

  migrate:
    <<: *app
    # Every step is safe to repeat; `up` runs it again on every start.
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py load_presets"]
    environment:
      <<: *app-env
      SERVICE_NAME: migrate
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    cpus: "1"
    mem_limit: 512m
    pids_limit: 256

  web:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_NAME: web
      # A database connection per request, closed when it ends: each request runs its sync
      # work on a thread of its own, where a kept connection would be stranded (config/settings).
      DB_CONN_MAX_AGE: "0"
      # Only the edge and the app's own services can reach web, so proxy headers are believed.
      FORWARDED_ALLOW_IPS: "*"
    networks: [backend, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    cpus: "1"
    mem_limit: 768m
    pids_limit: 256

  bot:
    <<: *app
    command: ["python", "manage.py", "runbot"]
    environment:
      <<: *app-env
      SERVICE_NAME: bot
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The heartbeat file is at most 60 s old (bot/client.py's Heartbeat; `manage.py
    # bot_healthcheck` is the same check for a person to run). Plain Python, no Django, so the
    # check itself stays cheap.
    healthcheck:
      test:
        - CMD
        - python
        - -I
        - -S
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.stat(os.environ['BOT_HEARTBEAT_FILE']).st_mtime > 60)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # Score OCR (INSTALL_OCR=true) loads its model in this process.
    cpus: "1"
    mem_limit: 1g
    pids_limit: 256

networks:
  # Postgres and the app's services. The bot reaches Discord from here.
  backend:
  # The edge and web only.
  edge:

volumes:
  pgdata:
  caddy-data:
  caddy-config:
