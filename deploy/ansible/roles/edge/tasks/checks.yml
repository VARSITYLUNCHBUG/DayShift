---
# One check per setting, so a failure names the one to fix. Each item holds a true/false and a
# message, never a value from the vault, so nothing needs hiding from the log.
- name: Check the settings
  ansible.builtin.assert:
    that: item.ok | bool
    fail_msg: "{{ item.msg }}"
    quiet: true
  loop:
    - name: "draftbot_domain"
      ok: "{{ edge_domain is match('^[A-Za-z0-9.-]+$') }}"
      msg: draftbot_domain must be a bare hostname.
    - name: "draftbot_grafana_domain"
      ok: "{{ edge_grafana_domain is match('^[A-Za-z0-9.-]*$') }}"
      msg: draftbot_grafana_domain must be empty or a bare hostname.
    - name: "edge_certificate"
      ok: "{{ edge_certificate in ['letsencrypt', 'selfsigned'] }}"
      msg: edge_certificate must be letsencrypt or selfsigned.
    - name: "edge_acme_email"
      ok: "{{ edge_certificate == 'selfsigned' or edge_acme_email is match(edge_email_pattern) }}"
      msg: edge_acme_email must be the Let's Encrypt account's email address.
    - name: "edge_acme_server"
      ok: "{{ edge_acme_server is match('^https://') }}"
      msg: edge_acme_server must be an https:// ACME directory.
    - name: "edge_grafana_allow_cidrs"
      ok: "{{ edge_grafana_allow_cidrs | reject('match', edge_cidr_pattern) | list | length == 0 }}"
      msg: edge_grafana_allow_cidrs must be addresses or CIDRs.
    - name: "edge_admin_allow_cidrs"
      ok: "{{ edge_admin_allow_cidrs | reject('match', edge_cidr_pattern) | list | length == 0 }}"
      msg: edge_admin_allow_cidrs must be addresses or CIDRs.
    - name: "edge_admin_satisfy"
      ok: "{{ edge_admin_satisfy in ['all', 'any'] }}"
      msg: edge_admin_satisfy must be all or any.
    - name: "Grafana's password prompt"
      ok: "{{ edge_grafana_domain | length == 0 or edge_grafana_basic_auth_users | length > 0 }}"
      msg: >-
        Grafana at draftbot_grafana_domain needs a password prompt: at least one
        vault_grafana_basic_auth_users entry.
    - name: "vault_grafana_basic_auth_users"
      ok: >-
        {{ (edge_grafana_basic_auth_users | map(attribute='username', default='')
            | reject('match', edge_user_pattern) | list)
           + (edge_grafana_basic_auth_users | map(attribute='password', default='') | map('string')
              | reject('match', edge_password_pattern) | list) == [] }}
      msg: >-
        Each vault_grafana_basic_auth_users entry needs a username (letters, digits, _ . -) and a
        password of 12+ characters on one line.
    - name: "vault_admin_basic_auth_users"
      ok: >-
        {{ (edge_admin_basic_auth_users | map(attribute='username', default='')
            | reject('match', edge_user_pattern) | list)
           + (edge_admin_basic_auth_users | map(attribute='password', default='') | map('string')
              | reject('match', edge_password_pattern) | list) == [] }}
      msg: >-
        Each vault_admin_basic_auth_users entry needs a username (letters, digits, _ . -) and a
        password of 12+ characters on one line.
  loop_control:
    label: "{{ item.name }}"
  vars:
    edge_cidr_pattern: '^[0-9A-Fa-f.:]+(/[0-9]{1,3})?$'
    edge_email_pattern: '^[^@\s]+@[^@\s]+$'
    edge_user_pattern: '^[A-Za-z0-9_.-]+$'
    edge_password_pattern: '^[^\n\r]{12,}\Z'
