# The default mode. Every mode runs the same flow: players vote for captains, the captains draft
# players, then the captain coinflip settles the sides and which team is Pick 1 ("first"), who bans
# and picks first. A timeout takes a random champion and captains can press Random.
# The hero order, with 1 as Pick 1's team and 2 as Pick 2's:
#   B1 B2 B1 B2 P1 P2 P2 P1 P2 P1 B2 B1 P2 P1 P1 P2 P1 P2
# 3 bans and 6 picks a team, 18 steps at 40 s a turn.
schema_version: 1
slug: draft_3ban
name: "3-ban draft"
provenance:
  source: "Server draft order, November 2026"
  night_shift_status: not_night_shift
team_size: 6
ready_check: { seconds: 180, refill_seconds: 120 }
captains: { vote_seconds: 45, min_games: 5, max_strikes: 3 }
player_draft: { order: FSSFFSSFFS, seconds: 45, on_timeout: auto_highest_rating }
champion_draft:
  coinflip_seconds: 20
  seconds: 40
  excluded_champion_ids: []
  steps:
    - { action: ban, team: first }
    - { action: ban, team: second }
    - { action: ban, team: first }
    - { action: ban, team: second }
    - { action: pick, team: first }
    - { action: pick, team: second, count: 2 }
    - { action: pick, team: first }
    - { action: pick, team: second }
    - { action: pick, team: first }
    - { action: ban, team: second }
    - { action: ban, team: first }
    - { action: pick, team: second }
    - { action: pick, team: first, count: 2 }
    - { action: pick, team: second }
    - { action: pick, team: first }
    - { action: pick, team: second }
lobby_code: { seconds: 180 }
results: { confirm_window_seconds: 300, reminder_minutes: 45, staff_escalation_minutes: 180 }
