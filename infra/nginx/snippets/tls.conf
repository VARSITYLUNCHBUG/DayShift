# Mozilla's "intermediate" TLS profile (ssl-config.mozilla.org): TLS 1.2 and 1.3, for every
# browser of the last several years. ffdhe2048.pem is the RFC 7919 group Mozilla
# publishes, so it is a public constant, not a secret.
#
# No OCSP stapling: Let's Encrypt stopped running OCSP in 2025, and its certificates carry no
# responder URL, so there is nothing to staple.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_dhparam /etc/nginx/snippets/ffdhe2048.pem;

ssl_session_timeout 1d;
ssl_session_cache shared:TLS:10m;
ssl_session_tickets off;
