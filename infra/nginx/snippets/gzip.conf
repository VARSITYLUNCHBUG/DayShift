# Compress text responses. Static files are served from their precompressed .gz copies instead
# (gzip_static in snippets/app.conf), and nginx never compresses a response twice. Dynamic HTML is compressed too (nginx always includes text/html):
# Django masks its CSRF token per response, which is its defence against BREACH.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    text/css
    text/javascript
    text/plain;
