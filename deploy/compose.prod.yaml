# Production on top of the root compose.yaml, for a server with a public domain. The Ansible app
# role puts both files in /opt/dayshift and writes .env there with COMPOSE_FILE set, so a plain
# `docker compose ...` in that directory uses them together. What changes:
#
# - the app services run the published image at DAYSHIFT_IMAGE_TAG and never build;
# - the edge serves the domain (EDGE_SITE) over HTTPS on 80 and 443; Caddy gets and renews the
#   certificate itself;
# - DEBUG is forced off, whatever .env says;
# - Postgres isn't published on the host. Backups run on the host (roles/app).

x-image: &image ${DAYSHIFT_IMAGE:-ghcr.io/varsitylunchbug/dayshift}:${DAYSHIFT_IMAGE_TAG:?Set DAYSHIFT_IMAGE_TAG}

services:
  edge:
    environment:
      EDGE_SITE: ${EDGE_SITE:?Set EDGE_SITE to the domain in .env}
    ports: !override
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"

  db:
    ports: !reset []

  migrate:
    image: *image
    build: !reset null
    environment:
      DEBUG: "false"

  web:
    image: *image
    build: !reset null
    environment:
      DEBUG: "false"

  bot:
    image: *image
    build: !reset null
    environment:
      DEBUG: "false"
