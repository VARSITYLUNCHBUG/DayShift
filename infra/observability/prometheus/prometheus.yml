# Prometheus for the draft-bot stack: compose.observability.yaml mounts this directory at
# /etc/prometheus. Every target is a compose service on the stack's own network; nothing here
# is reachable from outside it.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  # The app. web answers /metrics itself (league.observability); the bot's gateway and the
  # scheduler serve theirs on METRICS_PORT (bot.metrics).
  - job_name: web
    static_configs:
      - targets: [web:8000]

  - job_name: bot
    static_configs:
      - targets: [bot:9108]

  - job_name: scheduler
    static_configs:
      - targets: [scheduler:9108]

  # Infrastructure, through its exporters.
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: pgbouncer
    static_configs:
      - targets: [pgbouncer-exporter:9127]

  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]

  # The edge's certificate, for the expiry alert: a TLS handshake with the edge's HTTPS port.
  # An expiry date needs no 15 s resolution. Without TLS (dev, the quickstart) the probe fails,
  # the blackbox exporter logs that, and no expiry series exists.
  - job_name: tls
    scrape_interval: 2m
    metrics_path: /probe
    params:
      module: [tls_connect]
    static_configs:
      - targets: [edge:8443]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
