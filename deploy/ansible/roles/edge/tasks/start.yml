---
- name: Start or update the edge
  community.docker.docker_compose_v2:
    project_src: "{{ edge_root }}"
    services: [edge]
    dependencies: false
    wait: true
    wait_timeout: "{{ edge_wait_timeout }}"
  register: edge_started

# The image renders templates/*.template into conf.d (a tmpfs) only when the container starts,
# and compose doesn't recreate it for a changed file in a mounted folder. Rendered again here, the
# check below tests the new site and the reload serves it. A container just recreated rendered
# them itself.
- name: Render the edge's site templates again
  community.docker.docker_compose_v2_exec:
    project_src: "{{ edge_root }}"
    service: edge
    argv: [/docker-entrypoint.d/20-envsubst-on-templates.sh]
  changed_when: true
  when:
    - edge_started is not changed
    - edge_nginx_config | default({}) is changed or edge_acme_site | default({}) is changed

- name: Check the edge's configuration
  community.docker.docker_compose_v2_exec:
    project_src: "{{ edge_root }}"
    service: edge
    argv: [nginx, -t, -q]
  changed_when: false

# nginx re-reads its files and certificate without dropping a connection. A container that was
# just recreated already has them. Under --tags edge-start there is nothing new to load.
- name: Reload the edge for its new configuration or certificate
  community.docker.docker_compose_v2_exec:
    project_src: "{{ edge_root }}"
    service: edge
    argv: [nginx, -s, reload]
  changed_when: true
  when:
    - edge_started is not changed
    - >-
      edge_nginx_config | default({}) is changed
      or edge_acme_site | default({}) is changed
      or edge_grafana_config | default({}) is changed
      or edge_grafana_htpasswd | default({}) is changed
      or edge_admin_access_written | default({}) is changed
      or edge_admin_access_removed | default({}) is changed
      or edge_cert_needed | default(false)
