---
- name: Check the settings
  ansible.builtin.import_tasks: checks.yml
  when: not draftbot_checked | default(false)
  tags: [backups, backups-check]

- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ backups_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [backups]

- name: Install rclone and age for offsite copies
  ansible.builtin.apt:
    name: [rclone, age]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: backups_rclone_remote | length > 0
  tags: [backups, backups-offsite]

- name: Create rclone's config directory
  ansible.builtin.file:
    path: "{{ backups_rclone_conf_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: backups_rclone_remote | length > 0
  tags: [backups, backups-offsite]

- name: Write rclone's config
  ansible.builtin.copy:
    dest: "{{ backups_rclone_conf_path }}"
    content: "{{ backups_rclone_config }}"
    owner: root
    group: root
    mode: "0600"
  when: backups_rclone_remote | length > 0
  no_log: true
  diff: false
  tags: [backups, backups-offsite]

- name: Install the backup script
  ansible.builtin.template:
    src: draftbot-backup.sh.j2
    dest: "{{ backups_script }}"
    owner: root
    group: root
    mode: "0750"
  tags: [backups]

- name: Install the backup service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ backups_unit }}.service"
    - "{{ backups_unit }}.timer"
  notify: Reload systemd
  tags: [backups]

- name: Load the new units before enabling them
  ansible.builtin.meta: flush_handlers
  tags: [backups]

- name: Enable the nightly timer
  ansible.builtin.systemd_service:
    name: "{{ backups_unit }}.timer"
    enabled: true
    state: started
  tags: [backups]
