# Alertmanager with a Discord webhook: entrypoint.sh writes ALERTMANAGER_DISCORD_WEBHOOK_URL to
# the file below, since Alertmanager doesn't read environment variables.

route:
  receiver: discord
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # The dead man's switch (rules/infra.yml): pinged every minute, never posted to Discord.
    - matchers: [alertname="Watchdog"]
      receiver: watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

# A critical alert silences the same job's warnings: its error rate while it's down, say.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [job]

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /tmp/discord-webhook
        send_resolved: true
  # entrypoint.sh drops the webhook (keeping an empty receiver) when ALERTMANAGER_WATCHDOG_URL is
  # unset.
  - name: watchdog
    # BEGIN watchdog-webhook
    webhook_configs:
      - url_file: /tmp/watchdog-url
        send_resolved: false
    # END watchdog-webhook
