# The control panel's only server: the built SPA plus the two dev APIs on one origin, so the
# browser never needs CORS. It replaces the image's /etc/nginx/nginx.conf whole. nginx runs as
# the unprivileged `nginx` user and writes nothing outside /tmp, so the container can run with
# a read-only root filesystem and a tmpfs on /tmp.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"upstream":"$upstream_addr",'
        '"upstream_duration":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Report screenshots go through /_sim/attachments; the league takes up to 20 MB.
    client_max_body_size 21m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    # Not text/event-stream: compressing the event stream would buffer it.
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Upstreams are resolved per request through Docker's DNS, so the panel starts (and serves
    # its own pages) even when web or discord-sim is down or absent (real-Discord mode).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 8091;
        server_name _;
        root /usr/share/nginx/html;

        set $web http://web:8000;
        set $sim http://discord-sim:8090;

        include /etc/nginx/security-headers.conf;

        proxy_http_version 1.1;
        # The port too ($http_host, not $host): the simulator builds attachment URLs from it.
        # Django's ALLOWED_HOSTS ignores the port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # A stopped container keeps its cached address for up to 10 s: fail fast, not after 60 s.
        proxy_connect_timeout 5s;
        # Autopilot calls wait for the bot (up to ~10 s per click) and can chain many phases.
        proxy_read_timeout 300s;

        # nginx's own 502/504 (the upstream is down or unknown) as JSON the panel can show. The
        # upstreams' own error answers pass through untouched.
        error_page 502 504 = @unreachable;
        location @unreachable {
            default_type application/json;
            return 502 '{"error": "The service behind this path is not answering. Is it running?"}';
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /_control/ {
            proxy_pass $web;
        }

        # Server-Sent Events: no buffering, no caching, and a long-lived connection.
        location = /_sim/events {
            proxy_pass $sim;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /_sim/ {
            proxy_pass $sim;
        }

        # The simulator's stand-in for Discord's CDN: message attachments link here.
        location /attachments/ {
            proxy_pass $sim;
        }

        # Hashed file names: cache for good. A miss is a 404, never the app.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # SPA fallback: every other path is the app, revalidated on every load.
        location / {
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
            try_files $uri /index.html;
        }
    }
}
