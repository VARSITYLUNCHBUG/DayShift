---
# The Molecule scenario's own override (app_compose_extra_files): the edge answers the test CA's
# HTTP-01 challenges by the test domains' names, and certbot trusts the test CA's API.

services:
  edge:
    networks:
      molecule-acme:
        aliases: [draftbot.test, grafana.draftbot.test]

  certbot:
    networks: [default, molecule-acme]
    environment:
      REQUESTS_CA_BUNDLE: /etc/pebble/ca.pem
    volumes:
      - /opt/molecule-pebble/ca.pem:/etc/pebble/ca.pem:ro

networks:
  molecule-acme:
    external: true
