---
- name: Refuse to replace the live database without confirmation
  ansible.builtin.assert:
    that: backups_restore_confirm | bool
    fail_msg: >-
      Replacing the live database discards everything since the dump. Add
      -e backups_restore_confirm=true to go ahead. A backup is taken first.
    quiet: true
  when: backups_restore_mode == 'replace'

- name: Upload the dump from the controller
  ansible.builtin.copy:
    src: "{{ backups_restore_upload }}"
    dest: "{{ backups_dir }}/{{ backups_restore_upload | basename }}"
    owner: root
    group: root
    mode: "0600"
  when: backups_restore_upload | length > 0

- name: Find the newest dump
  ansible.builtin.find:
    paths: "{{ backups_dir }}"
    patterns: draftbot-*.dump
  register: backups_found
  when: backups_restore_file | length == 0 and backups_restore_upload | length == 0

- name: Check there is a dump to restore
  ansible.builtin.assert:
    that: backups_found.files | length > 0
    fail_msg: >-
      No draftbot-*.dump in {{ backups_dir }}. Take one with backup.yml, or name one with
      backups_restore_file or backups_restore_upload.
    quiet: true
  when: backups_found is not skipped

- name: Pick the dump to restore
  ansible.builtin.set_fact:
    backups_restore_path: >-
      {{
        backups_restore_file if backups_restore_file | length > 0
        else (backups_dir ~ '/' ~ backups_restore_upload | basename) if backups_restore_upload | length > 0
        else (backups_found.files | sort(attribute='mtime') | last).path
      }}

- name: Check the dump is there
  ansible.builtin.stat:
    path: "{{ backups_restore_path }}"
  register: backups_restore_stat
  failed_when: not backups_restore_stat.stat.exists

- name: Restore into a scratch database
  ansible.builtin.import_tasks: restore_verify.yml
  when: backups_restore_mode == 'verify'

- name: Replace the live database
  ansible.builtin.import_tasks: restore_replace.yml
  when: backups_restore_mode == 'replace'
