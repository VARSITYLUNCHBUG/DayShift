---
# The containers read these as their own users, so they are world-readable.
- name: Install nginx's configuration
  ansible.builtin.copy:
    src: "{{ edge_nginx_src }}/"
    dest: "{{ edge_root }}/infra/nginx/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  register: edge_nginx_config

- name: Create the edge's own directory
  ansible.builtin.file:
    path: "{{ edge_root }}/edge/acme"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the site served while there is no certificate
  ansible.builtin.copy:
    src: acme-only.conf.template
    dest: "{{ edge_root }}/edge/acme/app.conf.template"
    owner: root
    group: root
    mode: "0644"
  register: edge_acme_site

# certbot (as the edge's user) writes both; the edge reads them. Whatever uid 101 is on the host
# can't reach them: the project directory is root's alone.
- name: Create certbot's directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ edge_uid }}"
    group: "{{ edge_uid }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ edge_letsencrypt_dir }}", mode: "0700" }
    - { path: "{{ edge_root }}/acme-challenge", mode: "0755" }

# Both password prompts, Grafana's and the admin's, take {username, password} from the vault and
# are hashed the same way: on the server, so the controller needs no crypt library. The password
# goes on stdin, and the salt is fixed per host, prompt and user, so the same password gives the
# same file and no change.
- name: Hash the password prompts' passwords
  ansible.builtin.command:
    argv: [openssl, passwd, -6, -salt, "{{ edge_htpasswd_salt[:16] }}", -stdin]
    stdin: "{{ item.password }}"
  vars:
    edge_htpasswd_salt: "{{ (inventory_hostname ~ ':' ~ item.prompt ~ ':' ~ item.username) | hash('sha256') }}"
  loop: >-
    {{ ((edge_grafana_basic_auth_users if edge_grafana_domain else [])
        | map('combine', {'prompt': 'grafana'}) | list)
       + (edge_admin_basic_auth_users | map('combine', {'prompt': 'admin'}) | list) }}
  register: edge_htpasswd_hashes
  changed_when: false
  check_mode: false
  no_log: true

- name: Install Grafana's vhost
  ansible.builtin.template:
    src: grafana.conf.j2
    dest: "{{ edge_root }}/edge/grafana.conf"
    owner: "{{ edge_uid }}"
    group: "{{ edge_uid }}"
    mode: "0644"
  when: edge_grafana_domain | length > 0
  register: edge_grafana_config

# Hashes, but hashes of the vault's passwords: kept out of the log and of --diff.
- name: Install Grafana's password file
  ansible.builtin.template:
    src: htpasswd.j2
    dest: "{{ edge_root }}/edge/grafana.htpasswd"
    owner: "{{ edge_uid }}"
    group: "{{ edge_uid }}"
    mode: "0400"
  vars:
    edge_htpasswd_prompt: grafana
  when: edge_grafana_domain | length > 0
  register: edge_grafana_htpasswd
  no_log: true
  diff: false

- name: Remove Grafana's vhost when it is switched off
  ansible.builtin.file:
    path: "{{ edge_root }}/edge/{{ item }}"
    state: absent
  loop: [grafana.conf, grafana.htpasswd]
  when: edge_grafana_domain | length == 0

# The admin access hook: EDGE_ADMIN_ACCESS_DIR (.env) points the edge's
# /etc/nginx/admin-access here. Empty unless the inventory sets edge_admin_allow_cidrs or
# edge_admin_basic_auth_users. The edge (uid and gid 101) reads it through its group.
- name: Create the admin access folder
  ansible.builtin.file:
    path: "{{ edge_admin_access_dir }}"
    state: directory
    owner: root
    group: "{{ edge_uid }}"
    mode: "0750"

- name: Write the admin access rules and password file
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ edge_admin_access_dir }}/{{ item.dest }}"
    owner: root
    group: "{{ edge_uid }}"
    mode: "0640"
  vars:
    edge_htpasswd_prompt: admin
  loop: "{{ edge_admin_access_files | selectattr('enabled') }}"
  loop_control:
    label: "{{ item.dest }}"
  register: edge_admin_access_written
  no_log: true
  diff: false

- name: Remove the admin access files that are switched off
  ansible.builtin.file:
    path: "{{ edge_admin_access_dir }}/{{ item.dest }}"
    state: absent
  loop: "{{ edge_admin_access_files | rejectattr('enabled') }}"
  loop_control:
    label: "{{ item.dest }}"
  register: edge_admin_access_removed
