---
# Put rotated secrets into service. Change them in the vault first (docs/ops/secrets.md says
# where each new value comes from): this checks them, backs up, sets the new database, app role,
# monitoring role and Grafana passwords inside Postgres and Grafana, rewrites .env, .env.observability, the edge's
# password files and the webhooks, and recreates every container whose settings changed.
#   ansible-playbook -i inventories/<client> rotate-secrets.yml --ask-vault-pass
- name: Rotate dl-mm-discord secrets
  hosts: draftbot
  become: true
  serial: 1
  pre_tasks:
    # The new secrets, before anything is backed up or changed.
    - name: Check the inventory and the vault
      ansible.builtin.import_tasks: tasks/preflight.yml

    - name: Back up before rotating
      ansible.builtin.include_role:
        name: backups
        tasks_from: run.yml
  roles:
    - role: app
    - role: edge
    - role: observability
    - role: backups
  tasks:
    - name: Put the failure notice webhook in place
      ansible.builtin.include_role:
        name: base
        tasks_from: notify.yml
  post_tasks:
    - name: Say what else to check
      ansible.builtin.debug:
        msg: >-
          Done. A new DJANGO_SECRET_KEY signs everyone out of the admin and the web UI. If you
          reset the bot token or the OAuth2 secret in the Discord Developer Portal, the old ones
          stopped working there and then; this run put the new ones in place.
