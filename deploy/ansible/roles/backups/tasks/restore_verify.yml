---
- name: Create the scratch database
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T db psql -U draftbot -d postgres -v ON_ERROR_STOP=1
      -c "DROP DATABASE IF EXISTS {{ backups_scratch_db }} WITH (FORCE)"
      -c "CREATE DATABASE {{ backups_scratch_db }} OWNER draftbot"
    chdir: "{{ backups_compose_dir }}"
  changed_when: true

- name: Restore the dump into it, and drop it whatever happens
  block:
    - name: Restore the dump into the scratch database
      ansible.builtin.shell:
        cmd: >-
          docker compose exec -T db pg_restore -U draftbot -d {{ backups_scratch_db }}
          --no-owner --exit-on-error < {{ backups_restore_path | quote }}
        chdir: "{{ backups_compose_dir }}"
      changed_when: true

    # On the copy and on the live database, to compare: an empty copy of a live database that
    # has data is a dump of the wrong moment (before a truncate, say), however cleanly it restores.
    - name: Count the data in the restored copy and in the live database
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, db, psql, -U, draftbot, -d, "{{ item }}", -tA, -v, ON_ERROR_STOP=1,
               -c, "{{ backups_restore_check_sql }}"]
        chdir: "{{ backups_compose_dir }}"
      loop: ["{{ backups_scratch_db }}", draftbot]
      register: backups_check
      changed_when: false
      failed_when: backups_check.rc != 0 or backups_check.stdout | trim is not match('^[0-9]+$')

    - name: Check the restored copy holds data when the live database does
      ansible.builtin.assert:
        that: backups_restored_rows | int > 0 or backups_live_rows | int == 0
        fail_msg: >-
          {{ backups_restore_path }} restores, but holds no data ({{ backups_restore_check_sql }}
          returned 0) while the live database has {{ backups_live_rows }}. It is a dump of an empty
          or truncated database: use an older one.
        success_msg: >-
          {{ backups_restore_path }} restores cleanly: {{ backups_restore_check_sql }} returned
          {{ backups_restored_rows }} for the copy and {{ backups_live_rows }} for the live database{{
          ' (both empty: a new league)' if backups_live_rows | int == 0 and backups_restored_rows | int == 0 else '' }}.
      vars:
        backups_restored_rows: "{{ backups_check.results[0].stdout | trim }}"
        backups_live_rows: "{{ backups_check.results[1].stdout | trim }}"
  always:
    - name: Drop the scratch database
      ansible.builtin.command:
        cmd: >-
          docker compose exec -T db psql -U draftbot -d postgres
          -c "DROP DATABASE IF EXISTS {{ backups_scratch_db }} WITH (FORCE)"
        chdir: "{{ backups_compose_dir }}"
      changed_when: true
