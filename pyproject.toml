[project]
name = "dayshift"
version = "1.0.0"
description = "Discord bot that runs queue, captain draft, champion pick/ban and Elo for 6v6 Deadlock."
requires-python = ">=3.13,<3.14"
dependencies = [
    "dj-database-url>=2.3,<4",
    "discord.py>=2.7,<2.8",
    "django>=6.1,<6.2",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pyyaml>=6",
    "whitenoise>=6.9",
    "openskill>=6.2,<7",
    # The leaderboard images (bot/renderers/leaderboard_image.py), and the character maps that
    # pick a fallback font for each name's letters (bot/renderers/fonts.py).
    "pillow>=13.0.0",
    "fonttools>=4.55",
    "uvicorn[standard]>=0.30,<1",
    # The player web UI's websocket (league/web/live): one consumer, no channel layer.
    "channels>=4.3,<5",
    # The landing page's tagline (Markdown) and advert HTML, sanitised (league/services/landing.py).
    "nh3>=0.3",
    "markdown-it-py>=4",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2",
    "hypothesis>=2.0",
    "mypy>=1.15",
    "pre-commit>=4.7",
    "pytest>=8",
    "pytest-django>=4.10",
    "pytest-xdist>=3.8",
    "ruff>=0.11",
    "types-pyyaml>=6",
]
ocr = [
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pillow>=13.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
# pytest's defaults, plus tests/e2e: the browser suite runs in its own container.
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "e2e",
]
addopts = "-ra --strict-markers"
# WhiteNoise looks for the collected static files, which only the image build makes.
filterwarnings = ["ignore:No directory at:UserWarning"]
# Run in parallel with `pytest -n auto` (CI, make test). A plain `pytest` stays serial.
markers = ["slow: a long test; parallel runs start it first"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["league/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django Meta options are class-level by design.
"league/models/*.py" = ["RUF012"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["league/migrations/"]

# scoreocr is the optional score-OCR engine, typed loosely against numpy and pillow. Follow it so
# its signatures still check league/services/ocr.py, but don't report its own errors.
[[tool.mypy.overrides]]
module = ["scoreocr", "scoreocr.*"]
follow_imports = "silent"

[tool.django-stubs]
django_settings_module = "config.settings"
