---
edge_root: "{{ draftbot_root }}"
edge_domain: "{{ draftbot_domain }}"
# infra/nginx in the checkout you run Ansible from.
edge_nginx_src: "{{ role_path }}/../../../../infra/nginx"

# Where the certificate comes from. `letsencrypt`: certbot gets it over HTTP-01 (DNS must point
# here and port 80 be open) and renews it. `selfsigned`: a one-year certificate made on the
# server, for a test server without public DNS; browsers warn about it.
edge_certificate: letsencrypt
# The Let's Encrypt account's contact address (it no longer emails expiry warnings; the
# CertificateExpiringSoon alert does). Getting a certificate accepts the Let's Encrypt
# Subscriber Agreement for this account.
edge_acme_email: ""
# The ACME directory. Let's Encrypt's staging one, while you try things out:
# https://acme-staging-v02.api.letsencrypt.org/directory
edge_acme_server: https://acme-v02.api.letsencrypt.org/directory
# certbot renews 30 days before expiry; checking twice a day is what Let's Encrypt asks for.
edge_renew_on_calendar: "*-*-* 00,12:00:00"
edge_renew_randomized_delay: 1h

# Grafana through the edge at this name, on the same certificate. Empty keeps it on 127.0.0.1,
# for SSH tunnels only.
edge_grafana_domain: "{{ draftbot_grafana_domain | default('') }}"
# The password prompt in front of it, on top of Grafana's own login: a list of
# {username, password}, from the vault, hashed on the server like the admin's below. Required
# with edge_grafana_domain.
edge_grafana_basic_auth_users: []
# Only these addresses or CIDRs may reach it. Empty allows everyone (past the password prompt).
edge_grafana_allow_cidrs: []

# Access control for the Django admin (/admin/, its login form included), in front of Django's
# own login; both off by default. Only these addresses or CIDRs may reach it (empty: anyone).
edge_admin_allow_cidrs: []
# A password prompt: a list of {username, password}, from the vault. The role hashes each
# password on the server (SHA-512 crypt) into the edge's password file. Empty: no prompt.
edge_admin_basic_auth_users: []
# With both: `all` asks an allowed address for the password too, `any` lets it in without.
edge_admin_satisfy: all

edge_wait_timeout: 120
# At the end, fetch https://<domain>/readyz through the edge. Needs DNS pointing here.
edge_check_public_url: true
edge_public_url_validate_certs: true
