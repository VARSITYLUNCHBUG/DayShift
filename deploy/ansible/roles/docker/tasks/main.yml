---
- name: Remove distribution packages that clash with Docker's
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent
  tags: [docker]

- name: Install what the apt repository and Ansible's Docker modules need
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-debian
      - python3-requests
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [docker]

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [docker]

- name: Download Docker's apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_url }}/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  tags: [docker]

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "{{ docker_apt_url }}/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ docker_apt_arch[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  register: docker_repo
  tags: [docker]

# unattended-upgrades keeps these current (roles/base, base_unattended_docker). docker_upgrade
# upgrades them now, for a fix that shouldn't wait for the night: -e docker_upgrade=true --tags docker
- name: Install Docker Engine and the compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: "{{ 'latest' if docker_upgrade | bool else 'present' }}"
    update_cache: "{{ docker_repo is changed or docker_upgrade | bool }}"
  tags: [docker]

- name: Create /etc/docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [docker, docker-config]

- name: Configure the daemon's log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json(indent=2) }}\n"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/dockerd --validate --config-file %s
  notify: Restart docker
  tags: [docker, docker-config]

- name: Keep Docker running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  tags: [docker]

- name: Let these users run docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  tags: [docker]

- name: Apply a changed daemon configuration before anything starts containers
  ansible.builtin.meta: flush_handlers
  tags: [docker]
