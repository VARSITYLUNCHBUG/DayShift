---
- name: Find Grafana's port on this host
  ansible.builtin.command:
    cmd: docker compose port grafana 3000
    chdir: "{{ observability_root }}"
  register: observability_grafana_port
  changed_when: false
  check_mode: false

- name: Try the vault's password
  ansible.builtin.uri:
    url: "http://{{ observability_grafana_port.stdout | trim }}/api/user"
    user: admin
    password: "{{ observability_grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: observability_grafana_login
  # Grafana may still be starting after a restart for new configuration.
  until: observability_grafana_login.status in [200, 401]
  retries: 20
  delay: 3
  # Read-only, so --check runs it too and can say whether the password would change.
  check_mode: false
  no_log: true

# On stdin, so the password is never on a command line.
- name: Reset Grafana's admin password to the vault's
  community.docker.docker_compose_v2_exec:
    project_src: "{{ observability_root }}"
    service: grafana
    argv: [grafana, cli, admin, reset-admin-password, --password-from-stdin]
    stdin: "{{ observability_grafana_admin_password }}"
  when: observability_grafana_login.status == 401
  changed_when: true
  no_log: true
