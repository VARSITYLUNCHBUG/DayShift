---
argument_specs:
  main:
    short_description: Prometheus, Alertmanager, Grafana and the exporters.
    options:
      observability_enabled:
        type: bool
        default: true
        description: Run them, or remove their containers. Defaults to draftbot_observability.
      observability_root:
        type: path
        required: true
        description: The compose project directory. Defaults to draftbot_root.
      observability_repo_root:
        type: path
        description: The repository checkout on the controller.
      observability_grafana_admin_password:
        type: str
        default: ""
        no_log: true
        description: Grafana's admin password, 12+ characters, kept in step with the vault. Required.
      observability_alertmanager_discord_webhook_url:
        type: str
        default: ""
        no_log: true
        description: A Discord channel webhook for alerts. Empty only shows them.
      observability_wait_timeout:
        type: int
        default: 300
        description: Seconds the services have to become healthy.
