---
# Replace the live database with a dump. Destructive: it needs -e confirm=yes.
#   ansible-playbook -i inventories/<client> restore.yml -e confirm=yes            (the newest dump)
#   ansible-playbook -i inventories/<client> restore.yml -e confirm=yes -e dump=/var/backups/dayshift/<file>
- name: Restore DayShift from a dump
  hosts: dayshift
  become: true
  vars:
    restore_dir: "{{ dayshift_root | default('/opt/dayshift') }}"
  tasks:
    - name: Refuse without confirm=yes
      ansible.builtin.assert:
        that: confirm | default('') == 'yes'
        fail_msg: This replaces the live database. Run again with -e confirm=yes.
        quiet: true

    - name: Find the newest dump
      ansible.builtin.shell: set -o pipefail && ls -1t /var/backups/dayshift/dayshift-*.dump | head -n 1
      args:
        executable: /bin/bash
      register: restore_newest
      changed_when: false
      when: dump is not defined

    - name: Stop web and bot
      ansible.builtin.command:
        cmd: docker compose stop web bot
        chdir: "{{ restore_dir }}"
      changed_when: true

    - name: Restore the dump over the live database
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          docker compose exec -T db pg_restore -U dayshift -d dayshift --clean --if-exists
          --no-owner --exit-on-error < {{ (dump | default(restore_newest.stdout)) | quote }}
        chdir: "{{ restore_dir }}"
        executable: /bin/bash
      changed_when: true

    - name: Start everything again (migrate first)
      ansible.builtin.command:
        cmd: docker compose up --detach --wait --wait-timeout 300
        chdir: "{{ restore_dir }}"
      changed_when: true
