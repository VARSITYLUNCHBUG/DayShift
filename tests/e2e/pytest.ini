# The browser suite. Run it with scripts/test.sh e2e (see README.md here).
[pytest]
# Traces, screenshots and videos are kept for failed tests only, under test-results/.
addopts =
    -ra --strict-markers -p no:cacheprovider
    --browser chromium
    --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure
    --output test-results
# A safety net over the bounded waits inside each test.
timeout = 240
# pytest-playwright 0.10.0's own base_url fixture trips a pytest 9 deprecation.
filterwarnings =
    ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning
