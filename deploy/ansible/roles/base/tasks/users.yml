---
- name: Create the deploy user
  ansible.builtin.user:
    name: "{{ base_deploy_user }}"
    shell: /bin/bash
    create_home: true
    # Locked: it logs in with keys only and sudo needs no password.
    password: "!"
    update_password: on_create

- name: Install the deploy user's SSH keys
  ansible.posix.authorized_key:
    user: "{{ base_deploy_user }}"
    key: "{{ base_deploy_authorized_keys | join('\n') }}"
    exclusive: "{{ base_deploy_authorized_keys_exclusive }}"
    state: present

- name: Give the deploy user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-draftbot-deploy
    content: "{{ base_deploy_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
