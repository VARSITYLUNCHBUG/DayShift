# Unit tests for the alert rules:
#   promtool test rules infra/observability/prometheus/tests/rules_test.yml
# (run from the prom/prometheus image with infra/observability/prometheus mounted at
# /etc/prometheus; see infra/observability/README.md).

rule_files:
  - ../rules/app.yml
  - ../rules/infra.yml

evaluation_interval: 15s

tests:
  # The dead man's switch fires from the first evaluation, with nothing to feed it.
  - interval: 15s
    alert_rule_test:
      - eval_time: 0s
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: Always firing, so that its absence can be noticed
              description: >-
                Alertmanager sends this to ALERTMANAGER_WATCHDOG_URL every minute. When the pings
                stop, that service tells you: Prometheus, Alertmanager or the host is down.

  # A loop that never went round: bot.client seeds its heartbeat with the start time, so it goes
  # stale like a loop that stopped.
  - interval: 15s
    input_series:
      - series: 'draftbot_loop_heartbeat_timestamp_seconds{job="bot",loop="effects"}'
        values: "0x20"
      - series: 'up{job="bot"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: BotHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: bot
              loop: effects
            exp_annotations:
              summary: "bot's effects loop has stopped"
              description: >-
                The effects loop last went round 3m 0s ago. It normally goes round every
                second.
              runbook: >-
                The process is up but stuck. Check `docker compose logs --tail 200 bot` for a
                loop error, then `docker compose restart bot`: pending work resumes from the
                database.

  # A stuck loop alerts once its heartbeat is over a minute old, for a minute.
  - interval: 15s
    input_series:
      - series: 'draftbot_loop_heartbeat_timestamp_seconds{job="scheduler",loop="deadlines"}'
        values: "0 15 30 30x20"
    alert_rule_test:
      - eval_time: 90s
        alertname: BotHeartbeatStale
        exp_alerts: []
      - eval_time: 3m
        alertname: BotHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: scheduler
              loop: deadlines
            exp_annotations:
              summary: "scheduler's deadlines loop has stopped"
              description: >-
                The deadlines loop last went round 2m 30s ago. It normally goes round every
                second.
              runbook: >-
                The process is up but stuck. Check `docker compose logs --tail 200 scheduler`
                for a loop error, then `docker compose restart scheduler`: pending work resumes
                from the database.

  # A late timer only alerts when it stays late.
  - interval: 30s
    input_series:
      - series: draftbot_deadlines_overdue
        values: "0 1 0 1 1 1 1 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: DeadlinesOverdue
        exp_alerts: []
      - eval_time: 4m
        alertname: DeadlinesOverdue
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Match timers aren't firing"
              description: >-
                1 live matches have a deadline over 30 s past that hasn't fired, so their phase
                won't move on by itself.
              runbook: >-
                The scheduler isn't ticking. `docker compose ps scheduler`, then its logs;
                restart it. Its startup grace gives everyone time to act before the late timers
                fire.

  # One effect failing for good is worth a look; retries alone aren't.
  - interval: 1m
    input_series:
      - series: 'draftbot_effects_total{job="bot",kind="render_board",outcome="failed"}'
        values: "0 0 1 1 1"
      - series: 'draftbot_effects_total{job="bot",kind="render_board",outcome="done"}'
        values: "0 100 200 300 400"
    alert_rule_test:
      - eval_time: 1m
        alertname: EffectsFailing
        exp_alerts: []
      - eval_time: 3m
        alertname: EffectsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: render_board
            exp_annotations:
              summary: render_board effects failed for good
              description: 1 render_board effects gave up in 15 minutes.
              runbook: >-
                Find them in the admin's outbox (status failed, last error), or in
                `docker compose logs bot` under "Effect failed for good". A 403 is a missing
                Discord permission on the server.

  # 10% of requests failing for five minutes.
  - interval: 1m
    input_series:
      - series: 'draftbot_http_requests_total{method="GET",route="/healthz",status="200"}'
        values: "0+90x10"
      - series: 'draftbot_http_requests_total{method="GET",route="/healthz",status="500"}'
        values: "0+10x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: WebErrorRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Over 5% of web requests fail
              description: 10% of requests answer 5xx.
              runbook: >-
                `docker compose logs --tail 200 web` for the tracebacks. If every request fails,
                check the database and pgbouncer dashboards first.

  # A disk past 85%, and the certificate inside its last two weeks.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4",mountpoint="/"}'
        values: "10x15"
      - series: 'node_filesystem_size_bytes{fstype="ext4",mountpoint="/"}'
        values: "100x15"
      - series: 'node_filesystem_readonly{fstype="ext4",mountpoint="/"}'
        values: "0x15"
      # Full but read-only, such as a mounted image: never an alert.
      - series: 'node_filesystem_avail_bytes{fstype="ext4",mountpoint="/usr/src"}'
        values: "0x15"
      - series: 'node_filesystem_size_bytes{fstype="ext4",mountpoint="/usr/src"}'
        values: "100x15"
      - series: 'node_filesystem_readonly{fstype="ext4",mountpoint="/usr/src"}'
        values: "1x15"
      - series: 'node_filesystem_avail_bytes{fstype="tmpfs",mountpoint="/run"}'
        values: "1x15"
      - series: 'node_filesystem_size_bytes{fstype="tmpfs",mountpoint="/run"}'
        values: "100x15"
      - series: 'probe_ssl_earliest_cert_expiry{instance="edge:8443"}'
        values: "864000x90"
      # Unsynchronised from the start: fires after 5m of history plus the 10m `for`.
      - series: 'node_timex_sync_status{instance="node-exporter:9100"}'
        values: "0x20"
      - series: 'node_timex_offset_seconds{instance="node-exporter:9100"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: ClockNotSynchronised
        exp_alerts: []
      - eval_time: 16m
        alertname: ClockNotSynchronised
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node-exporter:9100
            exp_annotations:
              summary: The server's clock isn't synchronised or is over 0.5 s off
              description: >-
                Match timers, ready-check deadlines and TLS all trust the clock; a drifting one
                fires deadlines early or late.
              runbook: >-
                `timedatectl status`, then `sudo systemctl restart systemd-timesyncd` and
                `journalctl -u systemd-timesyncd`. Outbound UDP 123 must be allowed.
      - eval_time: 15m
        alertname: DiskSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: / is 90% full
              description: Postgres stops writing when the disk fills.
              runbook: >-
                `df -h`, then `docker system df`. Old images: `docker image prune`. Old backups:
                the backup retention in the inventory. Prometheus keeps at most its size cap.
      - eval_time: 61m
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: edge:8443
            exp_annotations:
              summary: The TLS certificate expires in 9d 22h 59m 0s
              description: certbot renews 30 days ahead, so renewal has been failing for two weeks.
              runbook: >-
                `sudo journalctl -u draftbot-certbot-renew` for the renewal error, then
                `sudo /usr/local/sbin/draftbot-certbot-renew --dry-run`. Usually DNS no longer
                points here or port 80 is blocked.

  # A probe that keeps failing alerts after 30 minutes; one that recovers in time doesn't.
  - interval: 2m
    input_series:
      - series: 'probe_success{job="tls",instance="edge:8443"}'
        values: "0x20"
      - series: 'probe_success{job="tls",instance="other:8443"}'
        values: "0x10 1x10"
    alert_rule_test:
      - eval_time: 28m
        alertname: CertificateProbeFailing
      - eval_time: 32m
        alertname: CertificateProbeFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: tls
              instance: edge:8443
            exp_annotations:
              summary: The edge's certificate can't be read
              description: >-
                The TLS probe of edge:8443 has failed for 30 minutes, so its expiry
                isn't being watched.
              runbook: >-
                `docker compose logs blackbox-exporter` for the handshake error. "unrecognized name"
                means EDGE_SERVER_NAME isn't the edge's server name.

  # An exporter that stops answering alerts after 5 minutes. The app's own targets and the TLS
  # probe have alerts of their own, so they never fire this one.
  - interval: 1m
    input_series:
      - series: 'up{job="postgres",instance="postgres-exporter:9187"}'
        values: "0x10"
      - series: 'up{job="web",instance="web:8000"}'
        values: "0x10"
      - series: 'up{job="tls",instance="edge:8443"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: ExporterDown
      - eval_time: 6m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: postgres
              instance: postgres-exporter:9187
            exp_annotations:
              summary: postgres metrics are missing
              description: Prometheus hasn't been able to scrape postgres-exporter:9187 for 5 minutes.
              runbook: "`docker compose ps` and the logs of the exporter for postgres."

  # A dead blackbox exporter: probe_success has no data, so only `up` of the tls job can tell.
  - interval: 2m
    input_series:
      - series: 'up{job="tls",instance="edge:8443"}'
        values: "1 1 0x10"
    alert_rule_test:
      - eval_time: 12m
        alertname: BlackboxExporterDown
      - eval_time: 16m
        alertname: BlackboxExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: tls
              instance: edge:8443
            exp_annotations:
              summary: The blackbox exporter isn't answering
              description: >-
                Prometheus hasn't been able to run the TLS probe of edge:8443 for 10
                minutes, so the certificate's expiry isn't being watched.
              runbook: "`docker compose ps blackbox-exporter`, `docker compose logs blackbox-exporter`."

  # Slow gateway heartbeats for ten minutes.
  - interval: 1m
    input_series:
      - series: 'draftbot_gateway_latency_seconds{job="bot",instance="bot:9108"}'
        values: "2x15"
    alert_rule_test:
      - eval_time: 9m
        alertname: GatewayLatencyHigh
      - eval_time: 11m
        alertname: GatewayLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot
              instance: bot:9108
            exp_annotations:
              summary: Discord gateway latency is 2s
              description: Clicks will feel slow. Usually Discord's side or the host's network.
              runbook: Check discordstatus.com and the Host dashboard's CPU.
