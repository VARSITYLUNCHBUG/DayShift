---
# web, bot and scheduler log in as draftbot_app. The migrate job creates that role or sets its
# password and grants (config/app_role.py), but only runs for a new image, so after a rotation
# the app's own command does it here, sending Postgres a SCRAM verifier, never the password.
# pgbouncer and the app pick the new password up from .env when start.yml recreates them.
#
# The check goes to `db` over the container network, where the password is checked.
- name: Check the database accepts the app role's password
  community.docker.docker_compose_v2_exec:
    project_src: "{{ app_root }}"
    service: db
    argv:
      - sh
      - -c
      - IFS= read -r PGPASSWORD && export PGPASSWORD && exec psql -h db -U draftbot_app -d draftbot -tAc 'SELECT 1'
    stdin: "{{ app_db_app_password }}"
  register: app_role_login
  changed_when: false
  failed_when: false
  # Read-only, so --check runs it too and can say whether the password would change.
  check_mode: false
  no_log: true

- name: Create the app role or set its password
  community.docker.docker_compose_v2_run:
    project_src: "{{ app_root }}"
    service: migrate
    argv: [python, -m, config.app_role]
    no_deps: true
    cleanup: true
  when: app_role_login.rc != 0
  changed_when: true
  no_log: true
