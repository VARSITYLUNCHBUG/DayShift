---
- name: Configure the SSH jail
  ansible.builtin.template:
    src: fail2ban-jail.local.j2
    dest: /etc/fail2ban/jail.d/draftbot.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Keep fail2ban running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
