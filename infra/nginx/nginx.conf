# The edge: the stack's only ingress. Runs as nginx-unprivileged (uid 101) on a read-only root,
# so the pid file and temp paths live on the /tmp tmpfs.
#
# Mounted by compose.yaml:
#   infra/nginx/nginx.conf          -> /etc/nginx/nginx.conf
#   infra/nginx/snippets/           -> /etc/nginx/snippets/
#   infra/nginx/templates/<site>/   -> /etc/nginx/templates/  (rendered into conf.d by the image)
#
# <site> is `http` (plain HTTP on 8080: the quickstart, dev and test) or `https` (TLS on 8443,
# ACME and redirects on 8080: production). Both share snippets/app.conf.

# Sized for the container's CPU limit (compose.yaml: 1). `auto` would start one per host core.
worker_processes 2;
pid /tmp/nginx.pid;
# The image links this file to the container's stderr. `error`, not `warn`: nginx appends the
# request line, query string and all, to every line here, and rate-limit refusals are warnings
# (the access log has those, without the query). What remains, such as web being unreachable,
# still carries it; the OAuth codes callbacks carry are single-use and expire in minutes.
error_log /var/log/nginx/error.log error;

events {
    worker_connections 4096;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    include /etc/nginx/snippets/logging.conf;
    include /etc/nginx/snippets/gzip.conf;
    include /etc/nginx/snippets/websocket.conf;
    include /etc/nginx/snippets/rate-limits.conf;

    # Docker's embedded DNS. `resolve` below re-reads web's address when its container is
    # recreated, and lets the edge start (and `nginx -t` pass) before web exists.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream web {
        zone web 64k;
        server web:8000 resolve;
        keepalive 16;
    }

    # Internal only: stub_status for the nginx exporter and the container's healthcheck. Port
    # 8081 is never published, and only private addresses get an answer.
    server {
        listen 8081;
        server_name _;
        access_log off;

        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        location / {
            return 404;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
