# Test stacks. Nothing is published on the host, Postgres runs on tmpfs, and `make clean` (or
# `down -v`) leaves nothing behind. The Makefile drives it:
#
#   unit profile: db + tests. `make test` keeps db running between runs, so pytest's --reuse-db
#                 skips creating and migrating a database per xdist worker. The tests image is the
#                 Dockerfile's `test` target: cached dependency layers, then the working tree.
#   e2e profile:  db, migrate (+ dev_seed), web, bot, discord-sim, control-panel, chrome (a
#                 Playwright server) and e2e (tests/e2e against them). `make e2e`.

name: draftbot-test

x-test-app: &test-app
  # The image's dev target: the published one plus devtools/ and fixtures/ (Dockerfile).
  build:
    target: dev
  image: ${COMPOSE_PROJECT_NAME}/app:local
  restart: "no"
  # Self-contained: no .env needed. Everything the app reads is below. The reset is on each
  # service, not here: Compose v2 drops a !reset that arrives through `<<:`.

x-test-env: &test-env
  DATABASE_URL: postgres://draftbot:test@db:5432/draftbot
  BOT_HEARTBEAT_FILE: /tmp/bot-heartbeat
  DEBUG: "true"
  DJANGO_SECRET_KEY: test-only-not-secret
  DEV_CONTROL: "true"
  SECURE_COOKIES: "false"
  ALLOWED_HOSTS: localhost,127.0.0.1,web,control-panel
  LOG_FORMAT: text
  DISCORD_TOKEN: sim-token
  DISCORD_GUILD_ID: "1100000000000000001"
  DISCORD_API_BASE: http://discord-sim:8090/api/v10
  DISCORD_GATEWAY_URL: ws://discord-sim:8090/gateway
  DISCORD_SIM_URL: http://discord-sim:8090

# The test-only services get the same hardening as the app.
x-test-hardening: &test-hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"
  networks: [backend]
  tmpfs:
    - /tmp

services:
  db:
    environment:
      POSTGRES_PASSWORD: test
    # Speed over durability: the data dies with the container anyway. Room for every xdist
    # worker's test database.
    command: >-
      postgres -c timezone=UTC -c log_timezone=UTC
      -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      -c max_connections=200
    tmpfs: !override
      - /tmp
      - /var/run/postgresql:uid=70,gid=70
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700
    volumes: !reset []
    ports: !reset []
    restart: "no"

  tests:
    <<: *test-hardening
    profiles: [unit]
    build:
      context: .
      target: test
    image: ${COMPOSE_PROJECT_NAME}/tests:local
    environment:
      DATABASE_URL: postgres://draftbot:test@db:5432/draftbot
      DJANGO_SECRET_KEY: test-only-not-secret
      HYPOTHESIS_PROFILE: ${HYPOTHESIS_PROFILE:-dev}
      # The image is read-only: no pytest cache.
      PYTEST_ADDOPTS: -p no:cacheprovider
    depends_on:
      db:
        condition: service_healthy

  migrate:
    <<: *test-app
    profiles: [e2e]
    env_file: !reset []
    command: >-
      sh -c "python manage.py migrate --noinput && python manage.py load_presets
      && python manage.py dev_seed"
    environment:
      <<: *test-env
      SERVICE_NAME: migrate
    depends_on:
      db:
        condition: service_healthy
      discord-sim:
        condition: service_healthy

  web:
    <<: *test-app
    profiles: [e2e]
    env_file: !reset []
    environment:
      <<: *test-env
      SERVICE_NAME: web
      DB_CONN_MAX_AGE: "0"
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      interval: 10s

  bot:
    <<: *test-app
    profiles: [e2e]
    env_file: !reset []
    environment:
      <<: *test-env
      SERVICE_NAME: bot
    healthcheck:
      interval: 10s

  # Not part of either suite: they talk to web directly.
  edge:
    profiles: [edge]
    ports: !reset []
    restart: "no"

  # The dev stack's simulator and control panel, off the host and required here.
  discord-sim:
    extends:
      file: compose.dev.yaml
      service: discord-sim
    profiles: !override [e2e]
    ports: !reset []
    restart: "no"

  control-panel:
    extends:
      file: compose.dev.yaml
      service: control-panel
    profiles: !override [e2e]
    ports: !reset []
    restart: "no"
    depends_on: !override
      web:
        condition: service_healthy
      discord-sim:
        condition: service_healthy

  # A clean headless Chromium per run: each test connects to this Playwright server and gets a
  # fresh browser, so nothing carries over between runs. Playwright starts Chromium without its
  # sandbox (its default), so it needs no capabilities.
  chrome:
    <<: *test-hardening
    profiles: [e2e]
    build:
      context: tests/e2e
      target: chrome
    image: ${COMPOSE_PROJECT_NAME}/chrome:local
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/pwuser:uid=1001,gid=1001,size=64m
    shm_size: 1gb
    cpus: "2"
    # /dev/shm counts against this too.
    mem_limit: 3g
    # Chromium runs a process per tab and many threads each; threads count as pids.
    pids_limit: 2048
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3000), 3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s

  # Writes only test-results/ (mounted below) and HOME on /tmp. The one service here with a
  # writable root: pytest-playwright empties test-results/ by removing the folder, and only
  # tolerates that failing as "busy" (a mount point on a writable root).
  e2e:
    <<: *test-hardening
    read_only: false
    profiles: [e2e]
    build:
      context: tests/e2e
      target: e2e
    image: ${COMPOSE_PROJECT_NAME}/e2e:local
    tmpfs:
      - /tmp:size=256m,mode=1777
    cpus: "1"
    mem_limit: 1g
    pids_limit: 256
    # The host user (the Makefile sets these), so test-results/ stays yours.
    user: "${DRAFTBOT_UID:-1001}:${DRAFTBOT_GID:-1001}"
    environment:
      HOME: /tmp
      PW_WS_ENDPOINT: ws://chrome:3000/
      CONTROL_PANEL_URL: http://control-panel:8091
      WEB_URL: http://web:8000
      CONTROL_API_URL: http://web:8000/_control/api
      DISCORD_SIM_URL: http://discord-sim:8090
    volumes:
      - ./test-results/e2e:/e2e/test-results
    depends_on:
      chrome:
        condition: service_healthy
      control-panel:
        condition: service_healthy
      bot:
        condition: service_healthy
