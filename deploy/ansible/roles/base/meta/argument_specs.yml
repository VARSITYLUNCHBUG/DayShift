---
argument_specs:
  main:
    short_description: Server baseline for a draftbot host.
    options:
      base_timezone:
        type: str
        default: Etc/UTC
        description: The server's timezone, as a tz database name.
      base_packages:
        type: list
        elements: str
        description: Packages every server gets.
      base_extra_packages:
        type: list
        elements: str
        default: []
        description: More packages to install.
      base_deploy_user:
        type: str
        default: deploy
        description: The login user for Ansible and people. It gets passwordless sudo.
      base_deploy_authorized_keys:
        type: list
        elements: str
        required: true
        description: Public SSH keys for the deploy user. At least one, since password logins are off.
      base_deploy_authorized_keys_exclusive:
        type: bool
        default: true
        description: Remove keys that aren't in base_deploy_authorized_keys.
      base_ssh_permit_root_login:
        type: str
        default: "no"
        choices: ["no", "prohibit-password"]
        description: sshd's PermitRootLogin.
      base_ssh_allow_cidrs:
        type: list
        elements: str
        default: [any]
        description: Where SSH is allowed from, rate limited. `any` for everywhere.
      base_firewall_enabled:
        type: bool
        default: true
        description: Turn ufw on with a deny-incoming policy.
      base_firewall_allowed:
        type: list
        elements: dict
        description: Ports to open besides SSH, as {port, proto}.
      base_fail2ban_enabled:
        type: bool
        default: true
        description: Ban addresses that keep failing SSH logins.
      base_fail2ban_bantime:
        type: str
        default: 1h
        description: How long a ban lasts.
      base_fail2ban_findtime:
        type: str
        default: 10m
        description: The window failures are counted in.
      base_fail2ban_maxretry:
        type: int
        default: 5
        description: Failures in the window before a ban.
      base_unattended_upgrades_enabled:
        type: bool
        default: true
        description: Install security updates every day.
      base_unattended_docker:
        type: bool
        default: true
        description: >-
          Let those daily updates upgrade Docker (docker-ce, containerd.io and its runc, the
          compose plugin) from Docker's repository too. Containers keep running (live-restore).
      base_time_sync_package:
        type: str
        default: systemd-timesyncd
        description: The NTP client installed unless the server already runs chrony, ntpsec, ntp or openntpd.
      base_unattended_reboot:
        type: bool
        default: false
        description: Reboot by itself when an update needs it.
      base_unattended_reboot_time:
        type: str
        default: "04:00"
        description: When that reboot happens, in server time.
      base_notify_discord_webhook_url:
        type: str
        default: ""
        no_log: true
        description: A Discord channel webhook that hears about failed draftbot units. Empty logs them only.
  notify:
    short_description: The unit that reports failed draftbot units, and its webhook.
    options:
      base_notify_discord_webhook_url:
        type: str
        default: ""
        no_log: true
        description: A Discord channel webhook that hears about failed draftbot units. Empty logs them only.
