---
# Upgrade to another image tag: back up, then pull and restart. migrate runs before web and bot.
#   ansible-playbook -i inventories/<client> deploy.yml --ask-vault-pass -e draftbot_image_tag=sha-<commit>
# To roll back, deploy the old tag; if the new one migrated the database, restore the backup this
# run took first (restore.yml).
- name: Deploy a dl-mm-discord image
  hosts: draftbot
  become: true
  tasks:
    - name: Back up before the upgrade
      ansible.builtin.command: /usr/local/bin/draftbot-backup
      changed_when: true
      failed_when: false
      register: deploy_backup

    - name: Show the backup
      ansible.builtin.debug:
        msg: "{{ deploy_backup.stdout_lines | default(['No backup: this server has no install yet.']) }}"

    - name: Install and start the new image
      ansible.builtin.include_role:
        name: app
      vars:
        draftbot_pull: always
