---
- name: Schedule the daily package list update and upgrade
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Configure what unattended-upgrades does
  ansible.builtin.template:
    src: 52draftbot-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52draftbot-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
