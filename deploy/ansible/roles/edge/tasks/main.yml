---
- name: Check the settings
  ansible.builtin.import_tasks: checks.yml
  when: not draftbot_checked | default(false)
  tags: [edge, edge-check]

- name: Install the edge's configuration
  ansible.builtin.import_tasks: files.yml
  tags: [edge, edge-files]

- name: Get the certificate
  ansible.builtin.import_tasks: certificate.yml
  tags: [edge, edge-certificate]

- name: Start the edge
  ansible.builtin.import_tasks: start.yml
  tags: [edge, edge-start]

- name: Renew the certificate twice a day
  ansible.builtin.import_tasks: renew.yml
  when: edge_certificate == 'letsencrypt'
  tags: [edge, edge-renew]

- name: Check the site answers over HTTPS
  ansible.builtin.import_tasks: health.yml
  when: edge_check_public_url | bool
  tags: [edge, edge-health]
