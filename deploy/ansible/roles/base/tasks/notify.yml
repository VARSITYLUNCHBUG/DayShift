---
# Units name `OnFailure=draftbot-notify@%n.service` to be reported when they fail.
- name: Check the webhook is a plain https URL
  ansible.builtin.assert:
    that: base_notify_discord_webhook_url is match('^(https://[A-Za-z0-9./_?=&%~:-]+)?$')
    fail_msg: base_notify_discord_webhook_url must be a Discord webhook URL (https://...), or empty.
    quiet: true
  no_log: true

- name: Install the failure notice script
  ansible.builtin.template:
    src: draftbot-notify.sh.j2
    dest: "{{ base_notify_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the failure notice unit
  ansible.builtin.template:
    src: draftbot-notify@.service.j2
    dest: /etc/systemd/system/draftbot-notify@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Create /etc/draftbot
  ansible.builtin.file:
    path: "{{ base_notify_webhook_config | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# A curl config file, so the webhook's URL (its secret) is never on a command line.
- name: Write the webhook's curl config
  ansible.builtin.copy:
    dest: "{{ base_notify_webhook_config }}"
    content: 'url = "{{ base_notify_discord_webhook_url }}"{{ "\n" }}'
    owner: root
    group: root
    mode: "0600"
  when: base_notify_discord_webhook_url | length > 0
  no_log: true
  diff: false

- name: Remove the webhook's curl config when there is no webhook
  ansible.builtin.file:
    path: "{{ base_notify_webhook_config }}"
    state: absent
  when: base_notify_discord_webhook_url | length == 0

- name: Load the new unit before anything names it
  ansible.builtin.meta: flush_handlers
