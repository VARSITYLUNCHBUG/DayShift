---
# Every offsite copy is encrypted (templates/draftbot-backup.sh.j2), so a remote needs a key.
- name: Check offsite copies have a key to be encrypted to
  ansible.builtin.assert:
    that:
      - backups_rclone_remote | length == 0 or backups_offsite_age_recipients | length > 0
      - backups_offsite_age_recipients | reject('match', '^age1[02-9ac-hj-np-z]{58}$') | list | length == 0
      - backups_rclone_remote is not search("['\n\r]")
    fail_msg: >-
      Offsite copies (backups_rclone_remote) are encrypted before they leave the server: set
      backups_offsite_age_recipients to one or more age public keys (age1..., from `age-keygen`).
      The remote must hold no quote or line break.
    quiet: true
