# The browser suite: the whole stack against the Discord simulator, driven by Playwright. It runs
# on a dev machine (`make e2e`); this workflow is the same run by hand, from the Actions tab.
name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Browser suite (e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the stack, waits for it to be healthy, runs tests/e2e and tears everything down.
      - run: make e2e
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14
