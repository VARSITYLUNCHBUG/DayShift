# Mild observability on top of any environment: Prometheus, its exporters, Alertmanager and
# Grafana. Add it as one more -f, after the environment's own file:
#
#   docker compose -f compose.yaml -f compose.dev.yaml -f compose.observability.yaml up -d
#   docker compose -f compose.yaml -f deploy/compose.prod.yaml -f compose.observability.yaml up -d
#
# Grafana (GRAFANA_PORT, default 13000) and Prometheus (PROMETHEUS_PORT, default 19090) listen
# on 127.0.0.1 only: on a server, reach them through an SSH tunnel
# (`ssh -L 13000:127.0.0.1:13000 deploy@host`). Nothing else here is published.
#
# Secrets that are nobody else's business live in .env.observability (copy
# .env.observability.example; OBSERVABILITY_ENV_FILE names another file). Only Grafana and
# Alertmanager read it, so the app's containers never see them:
#   GRAFANA_ADMIN_PASSWORD             required: Grafana's `admin` user
#   ALERTMANAGER_DISCORD_WEBHOOK_URL   optional: post alerts to a Discord channel's webhook
#   ALERTMANAGER_WATCHDOG_URL          optional: a dead man's switch (healthchecks.io, say) that
#                                      the always-firing Watchdog alert pings every minute, and
#                                      that tells you when the pings stop
#
# Networks. These services share `default`, which none of the app's services join. Prometheus
# also joins `app` to scrape web, bot and scheduler, the database exporters `data`, and the two
# that probe the edge `edge-probes`. Grafana and Alertmanager are on `default` only: neither can
# reach Postgres, pgbouncer or the app.
#
# Compose variables (.env, or the shell):
#   DB_MONITOR_PASSWORD                required: the exporters' read-only database role,
#                                      draftbot_monitor, which migrate creates or updates. The
#                                      app's own containers get it blanked (compose.yaml).
#   EDGE_SERVER_NAME                   the edge's public name, for the certificate probe
#   GRAFANA_PORT / PROMETHEUS_PORT     optional: 13000 / 19090 on 127.0.0.1
#   PROMETHEUS_RETENTION / PROMETHEUS_RETENTION_SIZE   optional: 15d / 5GB
#
# Configuration lives in infra/observability (see its README).

x-monitor-password: &monitor-password
  ${DB_MONITOR_PASSWORD:?Set DB_MONITOR_PASSWORD in .env (letters and digits) for the database exporters}

x-observability-env: &observability-env
  - path: ${OBSERVABILITY_ENV_FILE:-.env.observability}
    # Grafana refuses to start without its password (infra/observability/grafana/entrypoint.sh).
    required: false

x-observability: &observability
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-exporter-limits: &exporter-limits
  cpus: "0.25"
  mem_limit: 128m
  pids_limit: 64

services:
  # The two exporters that talk to the edge reach it on a network of their own, so the edge
  # network stays the edge's and web's alone (web believes proxy headers from EDGE_IP only).
  edge:
    networks:
      edge-probes: {}

  # The read-only role the database exporters log in as: migrate creates it, or brings its
  # password up to date, on every start (league/observability/monitoring_role.py), and pgbouncer
  # lets it read its SHOW statistics.
  migrate:
    environment:
      DB_MONITOR_PASSWORD: *monitor-password

  pgbouncer:
    environment:
      DB_MONITOR_PASSWORD: *monitor-password

  prometheus:
    <<: *observability
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    networks: [default, app]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
      - --web.listen-address=:9090
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    cpus: "1"
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s

  alertmanager:
    <<: [*observability, *exporter-limits]
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command: ["--web.listen-address=:9093", "--cluster.listen-address="]
    # ALERTMANAGER_DISCORD_WEBHOOK_URL and ALERTMANAGER_WATCHDOG_URL, if they are set there.
    env_file: *observability-env
    volumes:
      - ./infra/observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    tmpfs:
      - /tmp:size=1m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

  grafana:
    <<: *observability
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    # Hands GRAFANA_ADMIN_PASSWORD (from .env.observability) to Grafana, or refuses to start.
    entrypoint: ["/bin/sh", "/etc/grafana/draftbot-entrypoint.sh"]
    env_file: *observability-env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    volumes:
      - ./infra/observability/grafana/entrypoint.sh:/etc/grafana/draftbot-entrypoint.sh:ro
      # Only these two, so the image's other provisioning directories stay in place.
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    cpus: "0.5"
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  node-exporter:
    <<: [*observability, *exporter-limits]
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres-exporter:
    <<: [*observability, *exporter-limits]
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    networks: [default, data]
    # As draftbot_monitor: pg_monitor's statistics, no tables, no superuser.
    environment:
      DATA_SOURCE_URI: db:5432/draftbot?sslmode=disable
      DATA_SOURCE_USER: draftbot_monitor
      DATA_SOURCE_PASS: *monitor-password
    depends_on:
      # Which creates the role.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pgbouncer-exporter:
    <<: [*observability, *exporter-limits]
    image: prometheuscommunity/pgbouncer-exporter:v0.12.1@sha256:30f31b6c2efdad3647f8182cc7c1a3a19e42bae5d17387694989f969371c230d
    networks: [default, data]
    environment:
      # A key=value string, so the password (from PGPASSWORD) needs no URL escaping.
      # draftbot_monitor is pgbouncer's stats user (infra/pgbouncer/pgbouncer.ini).
      PGBOUNCER_EXPORTER_CONNECTION_STRING: host=pgbouncer port=6432 dbname=pgbouncer user=draftbot_monitor sslmode=disable
      PGPASSWORD: *monitor-password
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9127/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx-exporter:
    <<: [*observability, *exporter-limits]
    image: nginx/nginx-prometheus-exporter:1.5.3@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d
    # stub_status on the edge's internal-only listener (infra/nginx/nginx.conf). The image has no
    # shell for a healthcheck: Prometheus's `up` for the nginx job stands in.
    command: ["--nginx.scrape-uri=http://edge:8081/nginx_status", "--web.listen-address=:9113"]
    networks: [default, edge-probes]
    depends_on:
      edge:
        condition: service_started

  blackbox-exporter:
    <<: [*observability, *exporter-limits]
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    # The image runs as root; a TCP probe needs no privileges at all.
    user: "65534:65534"
    entrypoint: ["/bin/sh", "/etc/blackbox/entrypoint.sh"]
    command: ["--web.listen-address=:9115"]
    environment:
      # The edge's public name, which the TLS probe asks for (infra/observability/blackbox).
      EDGE_SERVER_NAME: ${EDGE_SERVER_NAME:-}
    networks: [default, edge-probes]
    volumes:
      - ./infra/observability/blackbox:/etc/blackbox:ro
    tmpfs:
      - /tmp:size=1m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
  edge-probes:
    internal: true

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
