---
# What a real server has that the test servers don't: DNS for the domains, the app image, and (on
# noble) a reachable ACME CA. The docker role runs here first so the stand-in image can be built;
# converge runs it again.
- name: Prepare the test servers
  hosts: draftbot
  become: true
  vars:
    prepare_pebble_dir: /opt/molecule-pebble
    prepare_repo_root: "{{ playbook_dir }}/../../../.."
  tasks:
    # No module waits for boot to finish.
    - name: Wait for systemd to finish booting  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl is-system-running --wait
      register: prepare_systemd
      changed_when: false
      failed_when: prepare_systemd.stdout not in ['running', 'degraded']

    - name: Resolve the test domains to this server
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 {{ draftbot_domain }} grafana.{{ draftbot_domain }}"
        # /etc/hosts is a bind mount in a container and can't be swapped by rename.
        unsafe_writes: true

    # Many servers already run Ubuntu's own Docker. The Ubuntu one here starts from it, so the
    # docker role has to replace it, as on a real server, and still bring Docker up.
    - name: Start the Ubuntu server from Ubuntu's docker.io
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
      when: ansible_facts["distribution_release"] == "noble"

    - name: Install Docker
      ansible.builtin.include_role:
        name: docker

    - name: Copy the stand-in app image's files
      ansible.builtin.copy:
        src: stub-app/
        dest: /opt/molecule-stub-app/
        mode: preserve

    # The app's own modules, not copies: the migrate job runs them, and verify.yml's rotation
    # tests check them. They need only psycopg and the stand-in's django/.
    - name: Create their packages' folders
      ansible.builtin.file:
        path: /opt/molecule-stub-app/{{ item }}
        state: directory
        mode: "0755"
      loop: [league/observability, config]

    - name: Copy in the app's database role commands
      ansible.builtin.copy:
        src: "{{ prepare_repo_root }}/{{ item }}"
        dest: /opt/molecule-stub-app/{{ item }}
        mode: "0644"
      loop:
        - league/observability/monitoring_role.py
        - config/app_role.py

    - name: Build the stand-in app image
      community.docker.docker_image_build:
        name: "{{ app_image }}"
        tag: "{{ draftbot_image_tag }}"
        path: /opt/molecule-stub-app
        # Picks up stub-app/ changes when prepare runs again on a kept instance.
        rebuild: always

    - name: Run the test CA
      when: edge_certificate == 'letsencrypt'
      block:
        - name: Copy the test CA's files
          ansible.builtin.copy:
            src: pebble/
            dest: "{{ prepare_pebble_dir }}/"
            mode: "0644"
            directory_mode: "0755"

        - name: Start the test CA
          community.docker.docker_compose_v2:
            project_src: "{{ prepare_pebble_dir }}"
            wait: true

        # certbot checks the CA's API certificate against this, the CA image's own test root.
        - name: Copy out the root of the test CA's API certificate
          ansible.builtin.command:
            cmd: docker compose cp pebble:/test/certs/pebble.minica.pem {{ prepare_pebble_dir }}/ca.pem
            chdir: "{{ prepare_pebble_dir }}"
            creates: "{{ prepare_pebble_dir }}/ca.pem"
