# Grafana at https://GRAFANA_DOMAIN through the edge, on top of compose.observability.yaml. The
# app role adds it when draftbot_grafana_domain is set; the edge role writes the vhost
# (edge/grafana.conf) and its password file. Grafana stays on 127.0.0.1 for SSH tunnels too.

services:
  edge:
    networks: [edge, edge-probes, grafana]
    volumes:
      # Swapped for /dev/null (no vhost) while the edge role gets the first certificate.
      - ${EDGE_GRAFANA_CONF:-./edge/grafana.conf}:/etc/nginx/conf.d/grafana.conf:ro
      - ./edge/grafana.htpasswd:/etc/nginx/grafana.htpasswd:ro

  grafana:
    networks: [default, grafana]
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?Set GRAFANA_DOMAIN in .env}/
      GF_SECURITY_COOKIE_SECURE: "true"

networks:
  # The edge and Grafana only. Not the edge network: web believes proxy headers from any address
  # on that one.
  grafana:
    internal: true
