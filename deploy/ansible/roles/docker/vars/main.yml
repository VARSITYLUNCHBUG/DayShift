---
# Ansible's architecture names to Debian's.
docker_apt_arch:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf

docker_daemon_config: >-
  {{
    {
      'log-driver': docker_log_driver,
      'log-opts': {'max-size': docker_log_max_size, 'max-file': docker_log_max_file | string},
      'live-restore': docker_live_restore,
    } | combine(docker_daemon_extra)
  }}
