---
- name: Install the renewal script
  ansible.builtin.template:
    src: draftbot-certbot-renew.sh.j2
    dest: "{{ edge_renew_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Install the renewal service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ edge_renew_unit }}.service"
    - "{{ edge_renew_unit }}.timer"
  notify: Reload systemd

- name: Load the new units before enabling them
  ansible.builtin.meta: flush_handlers

- name: Enable the renewal timer
  ansible.builtin.systemd_service:
    name: "{{ edge_renew_unit }}.timer"
    enabled: true
    state: started
