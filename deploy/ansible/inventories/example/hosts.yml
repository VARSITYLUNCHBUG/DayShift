---
# One inventory per client: copy inventories/example to inventories/<client> and edit it.
# The playbooks run against the `dayshift` group. One host per install.
dayshift:
  hosts:
    dayshift-example:
      # The server's public IP or a DNS name that resolves to it.
      ansible_host: 203.0.113.10
      # The deploy user the base role creates. The very first run, on a fresh server, logs in as
      # root instead: add `-e ansible_user=root` to that one command (see deploy/README.md).
      ansible_user: deploy
